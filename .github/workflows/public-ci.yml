name: Public Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v591-duokan-fixed-page-flow

permissions:
  contents: write

concurrency:
  group: materialize-v591-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize v591 source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout v591 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v591 source patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file=scripts/v591_source_patch.gz.b64
          if [[ ! -f "$patch_file" ]]; then
            echo "v591 source is already materialized"
            exit 0
          fi
          base64 -d "$patch_file" | gzip -dc > /tmp/v591.patch
          git apply --check /tmp/v591.patch
          git apply /tmp/v591.patch
          rm "$patch_file"
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v591: unify vertical flow with fixed chapter pages'
          git push origin HEAD:agent/v591-duokan-fixed-page-flow
