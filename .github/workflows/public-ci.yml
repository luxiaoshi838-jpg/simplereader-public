name: Public Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    name: Validate public Android source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Verify v722 cache overlay contract
        shell: bash
        run: bash tools/verify-v722-cache-overlay.sh

      - name: Pack exact source
        run: tar --exclude=.git --exclude='app/build' --exclude='.gradle' -czf /tmp/simplereader-current-source.tar.gz .

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: simplereader-current-source-${{ github.run_number }}
          path: /tmp/simplereader-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run v725 status log and shelf-cache contract tests
        shell: bash
        run: |
          chmod +x ./gradlew
          timeout --signal=INT 5m ./gradlew testDebugUnitTest \
            --tests 'com.simplereader.app.operation.V725FeatureContractTest' \
            --stacktrace --console=plain

      - name: Build debug APK for validation only
        shell: bash
        run: |
          timeout --signal=INT 5m ./gradlew assembleDebug --stacktrace --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'APK was built only inside this runner for validation and will not be uploaded or committed.'
