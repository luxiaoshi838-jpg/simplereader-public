name: Materialize v592 source

on:
  push:
    branches:
      - agent/v592-demand-page-controller

permissions:
  contents: write

concurrency:
  group: materialize-v592-source
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout v592 staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/v592-demand-page-controller
          fetch-depth: 0

      - name: Apply complete v592 source and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/v592_materialize.part00
          test -s scripts/v592_materialize.part01
          test -s scripts/v592_materialize.part02
          test -s scripts/v592_materialize.part03

          cat scripts/v592_materialize.part00 \
              scripts/v592_materialize.part01 \
              scripts/v592_materialize.part02 \
              scripts/v592_materialize.part03 \
            | base64 --decode | gzip --decompress > /tmp/v592.patch

          # The patch was generated from the last verified v591 source. Restore this
          # workflow to that exact source before applying; the patch installs the final
          # read-only v592 CI workflow itself.
          git show 6159c37699e9aca7d15ee20035ca0d2163f3822a:.github/workflows/public-ci.yml \
            > .github/workflows/public-ci.yml
          git apply --check /tmp/v592.patch
          git apply /tmp/v592.patch

          rm -f scripts/v592_materialize.part00 \
                scripts/v592_materialize.part01 \
                scripts/v592_materialize.part02 \
                scripts/v592_materialize.part03

          grep -Fq 'class ReaderPageCacheWorker' app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheWorker.kt
          grep -Fq 'ExistingWorkPolicy.KEEP' app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheManager.kt
          grep -Fq 'ReaderPageBoundaryCalculator' app/src/main/java/com/simplereader/app/ui/ReaderPageModel.kt
          grep -Fq 'MENU_CACHE_BOOK' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'work-runtime-ktx' app/build.gradle.kts
          grep -Fq 'foregroundServiceType="dataSync"' app/src/main/AndroidManifest.xml
          test ! -e scripts/v592_materialize.part00
          test ! -e scripts/v592_materialize.part01
          test ! -e scripts/v592_materialize.part02
          test ! -e scripts/v592_materialize.part03

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v592: materialize demand paging and background page cache'
          git push origin HEAD:agent/v592-demand-page-controller
