name: Public Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/v14-real-epub-chm-continuous
      - agent/v582-duokan-backgrounds
  pull_request:

permissions:
  contents: write

concurrency:
  group: public-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build public APK
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SIMPLE_READER_VERSION_CODE: '2098000587'
      SIMPLE_READER_VERSION_NAME: '2026.07.31.paged-reader.587'

    steps:
      - name: Checkout current v587 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v582-duokan-backgrounds
          fetch-depth: 0

      - name: Materialize v587 compile fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_v587_charsequence.py
          git add app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Fix v587 CharSequence page binding'
            git push origin HEAD:agent/v582-duokan-backgrounds
          fi

      - name: Pack exact source
        run: tar --exclude=.git --exclude='app/build' --exclude='.gradle' -czf /tmp/simplereader-current-source.tar.gz .

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: simplereader-current-source-${{ github.run_number }}
          path: /tmp/simplereader-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Export official Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/aapt2"
          tar -C "$(dirname "$build_tools")" -czf /tmp/android-build-tools.tar.gz "$(basename "$build_tools")"

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-tools-${{ github.run_number }}
          path: /tmp/android-build-tools.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Verify v587 architecture contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data class ReaderPageAnchor' app/src/main/java/com/simplereader/app/ui/ReaderPageModel.kt
          grep -Fq 'class PagedReaderView' app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          grep -Fq 'private suspend fun buildPagedWindow' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'applyPagedAnchor(target.startAnchor)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'com.simplereader.app.ui.PagedReaderView' app/src/main/res/layout/activity_reader.xml
          grep -Fq 'TurnMode.SIMULATE' app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          grep -Fq 'TurnMode.SLIDE' app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          grep -Fq 'TurnMode.FADE' app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          grep -Fq 'neutralTexture' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          ! grep -Fq 'PorterDuff.Mode.MULTIPLY' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt

      - name: Run release unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/v587-tests.log

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v587-build.log
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v587-unsigned.apk

      - name: Verify v587 APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v587-unsigned.apk | tee /tmp/v587-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v587-badging.log
          grep -Fq "versionCode='2098000587'" /tmp/v587-badging.log
          "$build_tools/aapt2" dump resources /tmp/SimpleReader-v587-unsigned.apk | tee /tmp/v587-resources.log
          grep -Fq 'id/pagedReaderView' /tmp/v587-resources.log
          grep -Fq 'drawable/reader_texture_paper_grain' /tmp/v587-resources.log
          grep -Fq 'drawable/reader_texture_paper_fiber' /tmp/v587-resources.log
          ! grep -Fq 'drawable/reader_material_patina' /tmp/v587-resources.log
          unzip -t /tmp/SimpleReader-v587-unsigned.apk | tee /tmp/v587-unzip.log
          sha256sum /tmp/SimpleReader-v587-unsigned.apk | tee /tmp/v587-unsigned.sha256

      - name: Upload unsigned v587 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v587-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v587-unsigned.apk
            /tmp/v587-tests.log
            /tmp/v587-build.log
            /tmp/v587-badging.log
            /tmp/v587-resources.log
            /tmp/v587-unzip.log
            /tmp/v587-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
