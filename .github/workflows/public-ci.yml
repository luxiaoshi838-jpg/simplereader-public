name: Public Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/v14-real-epub-chm-continuous
      - agent/v582-duokan-backgrounds
  pull_request:

permissions:
  contents: write

concurrency:
  group: public-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build public APK
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SIMPLE_READER_VERSION_CODE: '2098000589'
      SIMPLE_READER_VERSION_NAME: '2026.07.31.duokan-page-index-flow.589'

    steps:
      - name: Checkout current v589 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v582-duokan-backgrounds
          fetch-depth: 0

      - name: Materialize v589 Duokan flow and page index
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/v589_patch_chunk_*.b64 | base64 -d | gzip -dc > /tmp/v589.patch
          if git apply --check /tmp/v589.patch; then
            git apply /tmp/v589.patch
          elif git apply --reverse --check /tmp/v589.patch; then
            echo "v589 source already materialized"
          else
            echo "v589 patch does not apply cleanly" >&2
            exit 1
          fi
          python3 scripts/fix_v589_compile_01.py
          git add app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
                  app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt \
                  app/src/main/java/com/simplereader/app/ui/ReaderPageModel.kt \
                  app/src/test/java/com/simplereader/app/ui/PagedReaderArchitectureContractTest.kt \
                  app/src/test/java/com/simplereader/app/ui/ReaderCatalogAndProgressUiContractTest.kt
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'v589: fix actual bookmark page label'
            git push origin HEAD:agent/v582-duokan-backgrounds
          fi

      - name: Pack exact source
        run: tar --exclude=.git --exclude='app/build' --exclude='.gradle' -czf /tmp/simplereader-current-source.tar.gz .

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: simplereader-current-source-${{ github.run_number }}
          path: /tmp/simplereader-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Export official Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/aapt2"
          tar -C "$(dirname "$build_tools")" -czf /tmp/android-build-tools.tar.gz "$(basename "$build_tools")"

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-tools-${{ github.run_number }}
          path: /tmp/android-build-tools.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Verify v589 architecture contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'private fun isPagedReaderMode(): Boolean = pageTurnMode != TURN_MODE_VERTICAL' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'maybeExtendStructuredContinuousBuffer(scrollY)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'actualPageLabel(page)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'pagedChapterPageStarts' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'buildVisiblePagedWindow(anchor, signature)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'pagedReaderView.cancelNavigation()' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'ValueAnimator' app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          grep -Fq 'fun cancelNavigation()' app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          ! grep -Fq 'TurnMode.VERTICAL' app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          ! grep -Fq 'val unitsPerPage = pageSize' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'val layout = StaticLayout.Builder.obtain' app/src/main/java/com/simplereader/app/ui/ReaderPageModel.kt
          grep -Fq 'neutralTexture' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          ! grep -Fq 'PorterDuff.Mode.MULTIPLY' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt

      - name: Run release unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/v589-tests.log

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v589-build.log
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v589-unsigned.apk

      - name: Verify v589 APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v589-unsigned.apk | tee /tmp/v589-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v589-badging.log
          grep -Fq "versionCode='2098000589'" /tmp/v589-badging.log
          "$build_tools/aapt2" dump resources /tmp/SimpleReader-v589-unsigned.apk | tee /tmp/v589-resources.log
          grep -Fq 'id/pagedReaderView' /tmp/v589-resources.log
          grep -Fq 'drawable/reader_texture_paper_grain' /tmp/v589-resources.log
          grep -Fq 'drawable/reader_texture_paper_fiber' /tmp/v589-resources.log
          ! grep -Fq 'drawable/reader_material_patina' /tmp/v589-resources.log
          unzip -t /tmp/SimpleReader-v589-unsigned.apk | tee /tmp/v589-unzip.log
          sha256sum /tmp/SimpleReader-v589-unsigned.apk | tee /tmp/v589-unsigned.sha256

      - name: Upload unsigned v589 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v589-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v589-unsigned.apk
            /tmp/v589-tests.log
            /tmp/v589-build.log
            /tmp/v589-badging.log
            /tmp/v589-resources.log
            /tmp/v589-unzip.log
            /tmp/v589-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
