name: Public Android CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-v593-patch-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export-v593-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v593-duokan-page-anchor
          fetch-depth: 0

      - name: Rebuild corrected patch
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m bash -c '
            source_commit=7010a5cac46a1e465837f0f1541ae466a8dad4da
            {
              cat scripts/v593-correct00-0 scripts/v593-correct00-1 scripts/v593-correct00-2 scripts/v593-correct00-3
              for part in 01 02 03; do
                git show "$source_commit:scripts/v593-source.part$part"
              done
              cat scripts/v593-correct04-0 scripts/v593-correct04-1
              for part in 05 06a 06b 06c 06d 07a 07b; do
                git show "$source_commit:scripts/v593-source.part$part"
              done
            } | base64 -d > /tmp/v593-source.raw.patch
            sed "/^com\/simplereader\/app\/reader\/cache\/ReaderPageCacheManager.kt$/d" \
              /tmp/v593-source.raw.patch > /tmp/v593-source.cleaned.patch
            sha256sum /tmp/v593-source.raw.patch /tmp/v593-source.cleaned.patch > /tmp/v593-patch.sha256
            wc -l /tmp/v593-source.raw.patch /tmp/v593-source.cleaned.patch
          '

      - name: Upload reconstructed patch
        uses: actions/upload-artifact@v4
        with:
          name: v593-reconstructed-patch-${{ github.run_number }}
          path: |
            /tmp/v593-source.raw.patch
            /tmp/v593-source.cleaned.patch
            /tmp/v593-patch.sha256
          if-no-files-found: error
          retention-days: 2
