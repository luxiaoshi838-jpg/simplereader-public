name: Public Android CI

on:
  push:
    branches:
      - agent/v593-duokan-page-anchor

permissions:
  contents: write

concurrency:
  group: public-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-v593-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit seven verified source files
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m bash -c '
            source_commit=7010a5cac46a1e465837f0f1541ae466a8dad4da
            for part in 00 01 02 03 04 05 06a 06b 06c 06d 07a 07b; do
              git show "$source_commit:scripts/v593-source.part$part"
            done | base64 -d > /tmp/v593-source.patch
            echo "477bee88799d66e76e53e47fa06a12ed9c1eb33ab32426982508dca8612473f3  /tmp/v593-source.patch" | sha256sum -c -
            git apply --check /tmp/v593-source.patch
            git apply /tmp/v593-source.patch

            files=(
              app/src/main/java/com/simplereader/app/parser/TxtParser.kt
              app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheManager.kt
              app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheWorker.kt
              app/src/main/java/com/simplereader/app/ui/MainActivity.kt
              app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
              app/src/main/java/com/simplereader/app/ui/ReaderPageIndexStore.kt
              app/src/test/java/com/simplereader/app/ui/ReaderOneClickCacheArchitectureTest.kt
            )
            git add -- "${files[@]}"
            git diff --cached --check
            staged=$(git diff --cached --name-only)
            test "$(printf "%s\n" "$staged" | sed "/^$/d" | wc -l)" -eq 7
            for file in "${files[@]}"; do
              printf "%s\n" "$staged" | grep -Fxq "$file"
            done
            grep -Fq "arrayOf(\"批量管理分组\", \"同步书架\", \"一键缓存\")" app/src/main/java/com/simplereader/app/ui/MainActivity.kt
            grep -Fq "completeChapterCount" app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheWorker.kt
            grep -Fq "TXT_INITIAL_WINDOW_BYTES = 32 * 1024" app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
            ! grep -Fq "MENU_CACHE_BOOK" app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "v593: commit Duokan anchors and shelf cache source"
            git push origin HEAD:agent/v593-duokan-page-anchor
          '
