name: Export confirmed v599 source

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'temp/trigger-v599-export'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout confirmed v599 source
        uses: actions/checkout@v4
        with:
          ref: 6e14468061ec202d45d48170a0c79a48551a0743
      - name: Archive exact source
        run: zip -qr /tmp/confirmed-v599-source.zip . -x '.git/*' -x 'app/build/*' -x '.gradle/*'
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: confirmed-v599-source
          path: /tmp/confirmed-v599-source.zip
          retention-days: 1
