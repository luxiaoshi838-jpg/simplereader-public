name: Apply reader search jump and retention patch

on:
  push:
    branches: [ main ]
    paths:
      - scripts/patch_reader_search_jump_and_retention.py
      - .github/reader-search-patch-trigger

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply existing search restoration patch
        run: python scripts/patch_reader_search_jump_and_retention.py

      - name: Verify source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt').read_text(encoding='utf-8')
          checks = {
              'dismiss before jump': 'fun openHit(hit: ReaderSearchHit) {\n            dialog?.dismiss()',
              'retained results': '上次结果（${retained.hits.size}）',
              'per-book persistence': 'SEARCH_RESULTS_PREFS = "reader_search_results"',
              'whole epub search': 'findWholeStructuredSearchAll(query)',
              'structured jump': 'hit.stableKey.startsWith("whole:")',
          }
          missing = [name for name, token in checks.items() if token not in text]
          if missing:
              raise SystemExit('Missing contracts: ' + ', '.join(missing))
          print('reader search source contract passed')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Debug unit tests
        run: timeout --signal=INT 5m gradle --no-daemon :app:testDebugUnitTest

      - name: Release unit tests
        run: timeout --signal=INT 5m gradle --no-daemon :app:testReleaseUnitTest

      - name: Assemble debug
        env:
          SIMPLE_READER_VERSION_CODE: '2026075401'
          SIMPLE_READER_VERSION_NAME: '2026.07.24.v14.searchfix.401'
        run: timeout --signal=INT 5m gradle --no-daemon :app:assembleDebug

      - name: Assemble release
        env:
          SIMPLE_READER_VERSION_CODE: '2026075401'
          SIMPLE_READER_VERSION_NAME: '2026.07.24.v14.searchfix.401'
        run: timeout --signal=INT 5m gradle --no-daemon :app:assembleRelease

      - name: Commit verified source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m "修复书内搜索跳转并保留结果"
            git push origin HEAD:main
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-search-jump-retention-401
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-search-jump-retention-source-401
          path: app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          retention-days: 3
