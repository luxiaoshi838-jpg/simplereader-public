name: Merge final v615

on:
  push:
    branches:
      - agent/v615-reader-stability
    paths:
      - .github/workflows/merge-v615.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v615-reader-stability
          fetch-depth: 0
      - name: Remove helper and merge verified v615
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/merge-v615.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'v615: finalize public source'
          git push origin HEAD:agent/v615-reader-stability
          gh pr ready 57 --repo luxiaoshi838-jpg/simplereader-public
          gh pr merge 57 --repo luxiaoshi838-jpg/simplereader-public --squash --admin --subject 'v615: fix large-book reader, cache, cover and texture regressions'
