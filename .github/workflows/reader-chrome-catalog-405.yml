name: Reader chrome and catalog 405 verify

on:
  pull_request:
    branches:
      - agent/reader-chrome-catalog-base-405
    paths:
      - .github/reader-chrome-catalog-405-trigger

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIMPLE_READER_VERSION_CODE: '2026075405'
      SIMPLE_READER_VERSION_NAME: '2026.07.24.v14.chrome.405'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply controlled patch
        run: |
          python3 -m py_compile scripts/patch_reader_chrome_and_catalog_405.py
          python3 scripts/patch_reader_chrome_and_catalog_405.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug unit tests
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew clean testDebugUnitTest --stacktrace --console=plain > /tmp/debug-unit.log 2>&1
          code=$?
          tail -n 220 /tmp/debug-unit.log
          exit $code

      - name: Release unit tests
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain > /tmp/release-unit.log 2>&1
          code=$?
          tail -n 220 /tmp/release-unit.log
          exit $code

      - name: Assemble debug
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew assembleDebug --stacktrace --console=plain > /tmp/assemble-debug.log 2>&1
          code=$?
          tail -n 220 /tmp/assemble-debug.log
          exit $code

      - name: Assemble release
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain > /tmp/assemble-release.log 2>&1
          code=$?
          tail -n 220 /tmp/assemble-release.log
          exit $code

      - name: Commit verified business files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
            app/src/main/java/com/simplereader/app/parser/TxtParser.kt \
            app/src/main/res/layout/activity_reader.xml \
            app/src/test/java/com/simplereader/app/parser/TxtExpandedChapterTitleRegressionTest.kt \
            app/src/test/java/com/simplereader/app/ui/ReaderChromeContractTest.kt
          if ! git diff --cached --quiet; then
            git commit -m '修正阅读栏唤起与扩展章节识别'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-reader-chrome-catalog-405
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-reader-chrome-catalog-405-logs
          path: /tmp/*.log
          if-no-files-found: warn
          retention-days: 3
