name: Materialize and build v584 group actions

on:
  push:
    branches:
      - agent/v582-duokan-backgrounds

permissions:
  contents: write

concurrency:
  group: materialize-build-v584
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SIMPLE_READER_VERSION_CODE: '2098000584'
      SIMPLE_READER_VERSION_NAME: '2026.07.31.group-selection-actions.584'
    steps:
      - name: Checkout v584 source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v582-duokan-backgrounds
          fetch-depth: 0

      - name: Apply v584 group selection fix
        run: |
          set -euo pipefail
          python3 scripts/fix_v584_group_selection_actions.py
          grep -Fq 'private fun showSelectionActions()' app/src/main/java/com/simplereader/app/ui/GroupBooksActivity.kt
          grep -Fq 'arrayOf("修改书名", "导入分组", "删除")' app/src/main/java/com/simplereader/app/ui/GroupBooksActivity.kt
          grep -Fq 'arrayOf("导入分组", "删除")' app/src/main/java/com/simplereader/app/ui/GroupBooksActivity.kt
          grep -Fq 'private fun moveSelectedBooksToGroup()' app/src/main/java/com/simplereader/app/ui/GroupBooksActivity.kt
          grep -Fq 'showShelfSelectionActions()' app/src/main/java/com/simplereader/app/ui/MainActivity.kt

      - name: Commit materialized source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/simplereader/app/ui/GroupBooksActivity.kt \
                  app/src/test/java/com/simplereader/app/ui/GroupShelfSelectionActionsContractTest.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix group shelf single and multi selection actions'
            git push origin HEAD:agent/v582-duokan-backgrounds
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble v584
        run: |
          set -euo pipefail
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/v584-tests.log
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v584-build.log

      - name: Verify unsigned package
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v584-unsigned.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v584-unsigned.apk | tee /tmp/v584-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v584-badging.log
          grep -Fq "versionCode='2098000584'" /tmp/v584-badging.log
          sha256sum /tmp/SimpleReader-v584-unsigned.apk | tee /tmp/v584-unsigned.sha256

      - name: Upload unsigned v584 and logs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v584-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v584-unsigned.apk
            /tmp/v584-tests.log
            /tmp/v584-build.log
            /tmp/v584-badging.log
            /tmp/v584-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
