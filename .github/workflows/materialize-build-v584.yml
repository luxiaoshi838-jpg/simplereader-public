name: Clean temporary v584 build files

on:
  push:
    branches:
      - agent/v582-duokan-backgrounds

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v582-duokan-backgrounds
          fetch-depth: 0

      - name: Remove temporary build files
        run: |
          set -euo pipefail
          rm -rf ci-artifacts
          rm -f scripts/fix_v584_group_selection_actions.py
          rm -f .github/workflows/materialize-build-v584.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Clean temporary v584 build files'
            git push origin HEAD:agent/v582-duokan-backgrounds
          fi
