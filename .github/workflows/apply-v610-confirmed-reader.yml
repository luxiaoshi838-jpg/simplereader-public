name: Apply confirmed v610 reader

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/v610-confirmed-reader-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v610-confirmed-reader-ui
          fetch-depth: 0
      - name: Verify and apply reader changes
        shell: bash
        run: |
          set -euo pipefail
          echo '1b7d46ebe66dd3563fbcfbad132be656bcbdf49259393ea931e7ebbafe6b917a  .automation/v610-confirmed-reader.part00' | sha256sum -c -
          echo 'c861e0ff0e761b5716b9b8804c258520eca4e8473b2c27e9ca99340790133f45  .automation/v610-confirmed-reader.part01' | sha256sum -c -
          echo 'ed8d9de270fa5e08a82909b6b74b110bf6b9ec26464493e37737928bfcb03517  .automation/v610-confirmed-reader.part02' | sha256sum -c -
          echo 'd8223a56f74af31887ac0346fe8f4cad5e2444a81d0762e3a85afa14315341bf  .automation/v610-confirmed-reader.part03' | sha256sum -c -
          cat .automation/v610-confirmed-reader.part00 \
              .automation/v610-confirmed-reader.part01 \
              .automation/v610-confirmed-reader.part02 \
              .automation/v610-confirmed-reader.part03 > /tmp/payload.b64
          echo 'd89b3e75e581577959eee57dc74d57ed5f115046d8b0055d952c3f72b004b72b  /tmp/payload.b64' | sha256sum -c -
          base64 -d /tmp/payload.b64 | gzip -d > /tmp/v610.patch
          echo '84a637e1909e252ba9f4a5f97591d692040d8b220f5bbe8149ef81f78415e9a7  /tmp/v610.patch' | sha256sum -c -

          echo '3bd7918c20e3a56b7fc8d8db68ab3e7d0c385d1955924086739aaec50135fda2  .automation/v610-reader-activity.part00' | sha256sum -c -
          echo '09c92c5a0fd0689aea6ea57d47e611c4e4cfc96bb2eeb05f53b0c46def4fba0b  .automation/v610-reader-activity.part01' | sha256sum -c -
          cat .automation/v610-reader-activity.part00 \
              .automation/v610-reader-activity.part01 > /tmp/reader-activity.b64
          echo '439cec4f10cf89ee63480cdb5084c49c9c8a1fd5cbd09f867d6c69b7a4f5afe9  /tmp/reader-activity.b64' | sha256sum -c -
          base64 -d /tmp/reader-activity.b64 | gzip -d > /tmp/ReaderActivity.kt
          echo '3c888c251b7d6def694c68f1e9c6ad9ca8167cfe3fb06b361cf07125c3d7b5fc  /tmp/ReaderActivity.kt' | sha256sum -c -

          reader_path='app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt'
          git apply --check --exclude="$reader_path" /tmp/v610.patch
          git apply --exclude="$reader_path" /tmp/v610.patch
          cp /tmp/ReaderActivity.kt "$reader_path"

          mkdir -p app/src/main/java/com/simplereader/app/ui app/src/main/res/drawable-nodpi
          git show 6e14468061ec202d45d48170a0c79a48551a0743:app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt > app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt
          git show 6e14468061ec202d45d48170a0c79a48551a0743:app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt > app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          git show 6e14468061ec202d45d48170a0c79a48551a0743:app/src/main/java/com/simplereader/app/ui/ReaderBackgroundPicker.kt > app/src/main/java/com/simplereader/app/ui/ReaderBackgroundPicker.kt
          git show 6e14468061ec202d45d48170a0c79a48551a0743:app/src/main/res/drawable-nodpi/reader_texture_paper_grain.png > app/src/main/res/drawable-nodpi/reader_texture_paper_grain.png
          git show 6e14468061ec202d45d48170a0c79a48551a0743:app/src/main/res/drawable-nodpi/reader_texture_paper_fiber.png > app/src/main/res/drawable-nodpi/reader_texture_paper_fiber.png
          git show 6e14468061ec202d45d48170a0c79a48551a0743:app/src/main/res/drawable-nodpi/reader_material_frosted.png > app/src/main/res/drawable-nodpi/reader_material_frosted.png
          rm -f .automation/v610-confirmed-reader.part* .automation/v610-reader-activity.part*
          bash tools/verify-ui-policy.sh
          git checkout HEAD -- .github/workflows
      - name: Commit exact reader source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v610: restore confirmed reader UI and continuous vertical reading'
          git push origin HEAD:fix/v610-confirmed-reader-ui
