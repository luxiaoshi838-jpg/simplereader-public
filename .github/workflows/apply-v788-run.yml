name: Apply v788 source patch

on:
  push:
    branches: [source-v788]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v788
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_v788.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/simplereader/app/ui/MainActivity.kt app/src/main/res/layout/activity_main.xml app/build.gradle.kts app/src/test/java/com/simplereader/app/ui/ShelfV787ContractTest.kt app/src/test/java/com/simplereader/app/ui/ShelfV788LayoutSwitchContractTest.kt maintenance/V788_SHELF_LAYOUT_SWITCH_CRASH_FIX.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v788 fix shelf layout mode crash"
          git push origin HEAD:source-v788
