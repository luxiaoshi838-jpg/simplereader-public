name: Apply v608 PageEngine patch

on:
  push:
    branches:
      - work/page-engine-v608
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/page-engine-v608
          fetch-depth: 0

      - name: Rebuild and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/v608.patch.part* > /tmp/v608.patch.gz.b64
          echo '5c2b9ef80e9496fde820184ee1813ac2930ccf521b426f47a95a3cff8406076d  /tmp/v608.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v608.patch.gz.b64 > /tmp/v608.patch.gz
          echo 'd48a4102d5cc1d5ab4845cd82995469802c73fe06a8624b197b22c05caa5af91  /tmp/v608.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v608.patch.gz > /tmp/v608.patch
          echo '121d2d305336347e8ef1470ab4edea8ecfb098cea866660e73f201ebcf8580d0  /tmp/v608.patch' | sha256sum -c -
          git apply --check /tmp/v608.patch

      - name: Apply and publish source changes
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v608.patch
          rm -rf .automation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement unified real PageEngine on v600 UI baseline'
          git push origin HEAD:work/page-engine-v608
