name: Apply v591 application R imports

on:
  push:
    branches:
      - agent/v591-duokan-fixed-page-flow
    paths:
      - scripts/v591_import_app_r.patch
      - .github/workflows/v591-apply-r-imports.yml

permissions:
  contents: write

concurrency:
  group: apply-v591-r-imports
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v591-duokan-fixed-page-flow
          fetch-depth: 0
      - name: Apply imports and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scripts/v591_import_app_r.patch
          git apply scripts/v591_import_app_r.patch
          rm scripts/v591_import_app_r.patch
          rm .github/workflows/v591-apply-r-imports.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v591: import application resources in reader views'
          git push origin HEAD:agent/v591-duokan-fixed-page-flow
