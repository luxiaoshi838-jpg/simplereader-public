name: Apply v757 reader stability fix

on:
  push:
    branches: [source-v757]
    paths:
      - 'tools/v757-reader-stability-fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v757
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply reader stability patch
        run: python tools/v757-reader-stability-fix.py
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt app/src/main/java/com/simplereader/app/ui/VerticalPageAdapter.kt app/build.gradle.kts
          git diff --cached --quiet && exit 1
          git commit -m 'v757 remove drag rebind freeze and harden stable progress anchors'
          git push origin HEAD:source-v757
