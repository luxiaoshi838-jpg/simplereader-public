name: Apply 简阅 v758 滑动流畅度修复

on:
  push:
    branches:
      - source-v758
    paths:
      - tools/v758-scroll-smoothness-fix3.py
      - tools/v758-scroll-smoothness-fix2.py
      - tools/v758-scroll-smoothness-gates.sh
      - .github/workflows/v758-apply-scroll-smoothness.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v758 applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v758
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v758 source patch
        run: python3 tools/v758-scroll-smoothness-fix3.py
      - name: Preserve v757 stability gates
        run: bash tools/v757-52-gates.sh
      - name: Verify v758 smoothness gates
        run: bash tools/v758-scroll-smoothness-gates.sh
      - name: Diff check
        run: git diff --check
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
                  app/src/main/java/com/simplereader/app/ui/VerticalPageAdapter.kt \
                  .github/workflows/android-release-v2.yml \
                  TXT_READER_RENDERING_MAINTENANCE_LOG.md
          git commit -m 'v758 smooth vertical scrolling [v758 applied]'
          git push origin HEAD:source-v758
