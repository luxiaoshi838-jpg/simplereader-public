name: v725 compile and real launch gate

on:
  push:
    branches:
      - agent/v725
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simplereader-v725-launch-gate
  cancel-in-progress: true

jobs:
  build-and-launch:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v725-tested-source]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout v725 source
        uses: actions/checkout@v4

      - name: Reject tracked APK files
        shell: bash
        run: bash tools/verify-no-apk.sh

      - name: Apply deterministic v725 MainActivity integration
        run: |
          python3 tools/apply-v725.py
          grep -Fq 'ShelfCacheUiController.attach(this, readingStatsTextView) { updateUI() }' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -Fq 'arrayOf("导出", "同步", "日志")' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -Fq 'ShelfCacheUiController.showPreparing(this, readingStatsTextView)' app/src/main/java/com/simplereader/app/ui/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x ./gradlew tools/v725-emulator-test.sh

      - name: Build debug and run complete v725 feature tests
        env:
          SIMPLE_READER_VERSION_CODE: '2098000725'
          SIMPLE_READER_VERSION_NAME: '725'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug testDebugUnitTest \
            --tests 'com.simplereader.app.operation.ShelfCacheStatusTextTest' \
            --tests 'com.simplereader.app.operation.OperationLogStoreTest' \
            --tests 'com.simplereader.app.operation.V725FeatureContractTest' \
            --stacktrace 2>&1 | tee gradle-v725-debug.log

      - name: Verify debug package locally in runner
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-debug-badging.txt
          grep -Fq "package: name='com.simplereader.app' versionCode='2098000725' versionName='725'" apk-debug-badging.txt

      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator launch, migration and feature UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/v725-emulator-test.sh

      - name: Build release only after all emulator checks pass
        env:
          SIMPLE_READER_VERSION_CODE: '2098000725'
          SIMPLE_READER_VERSION_NAME: '725'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-v725-release.log

      - name: Verify release package locally in runner
        shell: bash
        run: |
          set -euo pipefail
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$release_apk"
          test -s "$release_apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt2" dump badging "$release_apk" | tee apk-release-badging.txt
          grep -Fq "package: name='com.simplereader.app' versionCode='2098000725' versionName='725'" apk-release-badging.txt
          echo 'APK validation complete; APK files remain ephemeral and are not uploaded.'

      - name: Upload v725 test logs only
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v725-test-logs
          path: |
            gradle-v725-debug.log
            gradle-v725-release.log
            apk-debug-badging.txt
            apk-release-badging.txt
            emulator-first-start.txt
            emulator-first-activity.txt
            emulator-first-logcat.txt
            emulator-legacy-start.txt
            emulator-legacy-activity.txt
            emulator-legacy-logcat.txt
            emulator-feature-logcat.txt
            emulator-cache-status.txt
            emulator-cache-idle.txt
            emulator-v725-result.txt
          if-no-files-found: error
          retention-days: 7

      - name: Persist tested MainActivity source to branch
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'v725: integrate tested cache UI [v725-tested-source]'
            git push origin HEAD:agent/v725
          fi
