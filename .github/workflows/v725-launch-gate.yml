name: v725 compile and real launch gate

on:
  push:
    branches:
      - agent/v725
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-launch:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v725-tested-source]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout v725 source
        uses: actions/checkout@v4

      - name: Apply deterministic v725 MainActivity integration
        run: |
          python3 tools/apply-v725.py
          grep -Fq 'ShelfCacheUiController.attach(this, readingStatsTextView) { updateUI() }' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -Fq 'arrayOf("导出", "同步", "日志")' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -Fq 'ShelfCacheUiController.showPreparing(this, readingStatsTextView)' app/src/main/java/com/simplereader/app/ui/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile, unit-test and build v725
        env:
          SIMPLE_READER_VERSION_CODE: '2098000725'
          SIMPLE_READER_VERSION_NAME: '725'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee gradle-v725.log

      - name: Verify expected APKs and package
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$release_apk"
          test -s "$release_apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-debug-badging.txt
          grep -Fq "package: name='com.simplereader.app' versionCode='2098000725' versionName='725'" apk-debug-badging.txt
          "$build_tools/aapt2" dump badging "$release_apk" | tee apk-release-badging.txt
          grep -Fq "package: name='com.simplereader.app' versionCode='2098000725' versionName='725'" apk-release-badging.txt

      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator launch and legacy-log migration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            pkg='com.simplereader.app'
            component='com.simplereader.app/.ui.MainActivity'
            apk='app/build/outputs/apk/debug/app-debug.apk'

            adb install -r "$apk"
            adb logcat -c
            adb shell am force-stop "$pkg"
            adb shell am start -W -n "$component" | tee emulator-first-start.txt
            sleep 5
            test -n "$(adb shell pidof "$pkg" | tr -d '\r')"
            adb shell dumpsys activity activities > emulator-first-activity.txt
            grep -Fq 'com.simplereader.app/.ui.MainActivity' emulator-first-activity.txt
            adb logcat -d > emulator-first-logcat.txt
            if grep -Fq 'Process: com.simplereader.app' emulator-first-logcat.txt; then
              echo 'v725 crashed on fresh launch'
              exit 31
            fi

            adb shell am force-stop "$pkg"
            python3 - <<'PY'
            from pathlib import Path
            payload = 'X' * (2 * 1024 * 1024)
            Path('/tmp/operation.xml').write_text(
                "<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n<map>\n<string name=\"log\">" + payload + "</string>\n</map>\n",
                encoding='utf-8'
            )
            PY
            adb shell "run-as $pkg sh -c 'mkdir -p shared_prefs && cat > shared_prefs/operation.xml'" < /tmp/operation.xml
            adb shell "run-as $pkg sh -c 'test -s shared_prefs/operation.xml'"

            adb logcat -c
            adb shell am start -W -n "$component" | tee emulator-legacy-start.txt
            sleep 5
            test -n "$(adb shell pidof "$pkg" | tr -d '\r')"
            adb shell dumpsys activity activities > emulator-legacy-activity.txt
            grep -Fq 'com.simplereader.app/.ui.MainActivity' emulator-legacy-activity.txt
            adb logcat -d > emulator-legacy-logcat.txt
            if grep -Fq 'Process: com.simplereader.app' emulator-legacy-logcat.txt; then
              echo 'v725 crashed after legacy operation log seed'
              exit 32
            fi
            if adb shell "run-as $pkg sh -c 'test -e shared_prefs/operation.xml'"; then
              echo 'legacy operation.xml was not physically removed'
              exit 33
            fi
            echo 'V725_EMULATOR_LAUNCH=PASS' | tee emulator-v725-result.txt
            echo 'V725_LEGACY_LOG_PURGE=PASS' | tee -a emulator-v725-result.txt

      - name: Upload v725 tested build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v725-tested-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/app-debug.apk
            gradle-v725.log
            apk-debug-badging.txt
            apk-release-badging.txt
            emulator-first-start.txt
            emulator-first-activity.txt
            emulator-first-logcat.txt
            emulator-legacy-start.txt
            emulator-legacy-activity.txt
            emulator-legacy-logcat.txt
            emulator-v725-result.txt
          if-no-files-found: error
          retention-days: 30

      - name: Persist tested MainActivity source to branch
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'v725: integrate tested cache UI [v725-tested-source]'
            git push origin HEAD:agent/v725
          fi
