name: Materialize and build v583 shelf actions

on:
  push:
    branches:
      - agent/v582-duokan-backgrounds
  pull_request:
    branches:
      - baseline/v575

permissions:
  contents: write

concurrency:
  group: materialize-build-v583-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SIMPLE_READER_VERSION_CODE: '2098000583'
      SIMPLE_READER_VERSION_NAME: '2026.07.31.shelf-selection-actions.583'
    steps:
      - name: Checkout v583 source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v582-duokan-backgrounds
          fetch-depth: 0

      - name: Apply v583 selection action fix
        run: |
          set -euo pipefail
          python3 scripts/fix_v583_shelf_selection_actions.py
          python3 scripts/fix_v583_test_syntax.py
          grep -Fq 'showShelfSelectionActions()' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -Fq 'arrayOf("修改书名", "导入分组", "删除")' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -Fq 'arrayOf("导入分组", "删除")' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -Fq 'private fun showMoveSelectedBooksToGroup()' app/src/main/java/com/simplereader/app/ui/MainActivity.kt

      - name: Commit materialized source
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/simplereader/app/ui/MainActivity.kt \
                  app/src/test/java/com/simplereader/app/ui/ShelfSelectionActionsContractTest.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix single and multi book selection actions'
            git push origin HEAD:agent/v582-duokan-backgrounds
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble v583
        run: |
          set -euo pipefail
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/v583-tests.log
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v583-build.log

      - name: Verify unsigned package
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v583-unsigned.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v583-unsigned.apk | tee /tmp/v583-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v583-badging.log
          grep -Fq "versionCode='2098000583'" /tmp/v583-badging.log
          sha256sum /tmp/SimpleReader-v583-unsigned.apk | tee /tmp/v583-unsigned.sha256

      - name: Upload unsigned v583 and logs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v583-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v583-unsigned.apk
            /tmp/v583-tests.log
            /tmp/v583-build.log
            /tmp/v583-badging.log
            /tmp/v583-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
