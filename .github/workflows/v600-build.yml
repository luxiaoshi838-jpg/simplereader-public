name: v600 reader startup fix build

on:
  pull_request:
    branches: [agent/v599-page-axis-vertical-fix]
  push:
    branches: [agent/v600-reader-startup-fix]

permissions:
  contents: write

jobs:
  build-v600:
    if: github.event_name == 'push' || github.head_ref == 'agent/v600-reader-startup-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SIMPLE_READER_VERSION_CODE: '2098000600'
      SIMPLE_READER_VERSION_NAME: '2026.08.02.reader-startup-fix.600'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v600-reader-startup-fix
          fetch-depth: 0

      - name: Apply startup fix within five minutes
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m python3 scripts/v600_apply.py
          grep -Fq '<FrameLayout' app/src/main/res/layout/activity_reader.xml
          ! grep -Fq 'ReaderViewportFrameLayout' app/src/main/res/layout/activity_reader.xml
          ! grep -Fq 'android:scrollbars="vertical"' app/src/main/res/layout/activity_reader.xml
          ! grep -Fq 'isScrollbarFadingEnabled = false' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Run startup contract tests within five minutes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --tests 'com.simplereader.app.ui.ReaderStartupContractTest' --stacktrace --console=plain | tee /tmp/v600-test.log

      - name: Build release within five minutes
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v600-build.log

      - name: Verify APK and commit source
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v600-unsigned.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v600-unsigned.apk | tee /tmp/v600-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v600-badging.log
          grep -Fq "versionCode='2098000600'" /tmp/v600-badging.log
          grep -Fq "versionName='2026.08.02.reader-startup-fix.600'" /tmp/v600-badging.log
          unzip -t /tmp/SimpleReader-v600-unsigned.apk | tee /tmp/v600-unzip.log
          sha256sum /tmp/SimpleReader-v600-unsigned.apk | tee /tmp/SimpleReader-v600-unsigned.sha256
          git add app/src/main/res/layout/activity_reader.xml \
            app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
            app/src/test/java/com/simplereader/app/ui/ReaderStartupContractTest.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'v600: fix reader layout inflation and Android 16 scrollbars'
            git push origin HEAD:agent/v600-reader-startup-fix
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v600-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v600-unsigned.apk
            /tmp/v600-test.log
            /tmp/v600-build.log
            /tmp/v600-badging.log
            /tmp/v600-unzip.log
            /tmp/SimpleReader-v600-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
