name: v599 export current source

on:
  push:
    branches: [agent/v599-page-axis-vertical-fix]
  pull_request:
    branches: [agent/v598-reader-only-duokan]

permissions:
  contents: read

jobs:
  export-source:
    if: github.event_name == 'push' || github.head_ref == 'agent/v599-page-axis-vertical-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v599-page-axis-vertical-fix
      - name: Package current source
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m zip -qr /tmp/simplereader-v599-current-source.zip . -x '.git/*' 'app/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: simplereader-v599-current-source
          path: /tmp/simplereader-v599-current-source.zip
          if-no-files-found: error
          retention-days: 2
