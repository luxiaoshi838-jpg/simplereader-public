name: Build v585 layered backgrounds

on:
  push:
    branches:
      - agent/v582-duokan-backgrounds
  pull_request:
    branches:
      - baseline/v575

permissions:
  contents: read

concurrency:
  group: build-v585-layered-backgrounds-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SIMPLE_READER_VERSION_CODE: '2098000585'
      SIMPLE_READER_VERSION_NAME: '2026.07.31.layered-reading-backgrounds.585'
    steps:
      - name: Checkout v585 source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v582-duokan-backgrounds
          fetch-depth: 0

      - name: Verify layered source and real texture assets
        run: |
          set -euo pipefail
          grep -Fq 'readerBackgroundColorId' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'readerBackgroundTextureId' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'readerBackgroundMaterialId' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'TextureOption(NONE_TEXTURE_ID, "纯净"' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          grep -Fq 'MaterialOption(NONE_MATERIAL_ID, "纯净"' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          ! grep -Fq '细麻纹' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          ! grep -Fq 'readerBackgroundStyleId' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          test -s app/src/main/res/drawable-nodpi/reader_texture_paper_grain.png
          test -s app/src/main/res/drawable-nodpi/reader_texture_paper_fiber.png
          test -s app/src/main/res/drawable-nodpi/reader_material_frosted.png
          test -s app/src/main/res/drawable-nodpi/reader_material_patina.png
          test -s THIRD_PARTY_TEXTURES.md
          file app/src/main/res/drawable-nodpi/reader_*.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble v585
        run: |
          set -euo pipefail
          timeout --signal=INT 6m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/v585-tests.log
          timeout --signal=INT 6m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v585-build.log

      - name: Verify v585 package and embedded layers
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v585-unsigned.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v585-unsigned.apk | tee /tmp/v585-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v585-badging.log
          grep -Fq "versionCode='2098000585'" /tmp/v585-badging.log
          unzip -l /tmp/SimpleReader-v585-unsigned.apk | tee /tmp/v585-zip-list.log
          grep -Fq 'reader_texture_paper_grain' /tmp/v585-zip-list.log
          grep -Fq 'reader_texture_paper_fiber' /tmp/v585-zip-list.log
          grep -Fq 'reader_material_frosted' /tmp/v585-zip-list.log
          grep -Fq 'reader_material_patina' /tmp/v585-zip-list.log
          unzip -p /tmp/SimpleReader-v585-unsigned.apk classes.dex | strings | grep -Fq 'background_texture_v585'
          unzip -p /tmp/SimpleReader-v585-unsigned.apk classes.dex | strings | grep -Fq 'background_material_v585'
          sha256sum /tmp/SimpleReader-v585-unsigned.apk | tee /tmp/v585-unsigned.sha256

      - name: Upload unsigned v585 and logs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v585-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v585-unsigned.apk
            /tmp/v585-tests.log
            /tmp/v585-build.log
            /tmp/v585-badging.log
            /tmp/v585-zip-list.log
            /tmp/v585-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
