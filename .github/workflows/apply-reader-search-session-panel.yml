name: Apply reader search session panel

on:
  pull_request:
    branches:
      - agent/search-session-panel-base
    paths:
      - .github/reader-search-session-panel-trigger

permissions:
  contents: read

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIMPLE_READER_VERSION_CODE: '2026075403'
      SIMPLE_READER_VERSION_NAME: '2026.07.24.v14.searchpanel.403'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply search panel patch
        run: python scripts/patch_reader_search_session_panel.py

      - name: Debug unit tests
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew clean testDebugUnitTest --stacktrace --console=plain > /tmp/debug-unit.log 2>&1
          code=$?
          tail -n 180 /tmp/debug-unit.log
          exit $code

      - name: Release unit tests
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain > /tmp/release-unit.log 2>&1
          code=$?
          tail -n 180 /tmp/release-unit.log
          exit $code

      - name: Assemble debug
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew assembleDebug --stacktrace --console=plain > /tmp/assemble-debug.log 2>&1
          code=$?
          tail -n 180 /tmp/assemble-debug.log
          exit $code

      - name: Assemble release
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain > /tmp/assemble-release.log 2>&1
          code=$?
          tail -n 180 /tmp/assemble-release.log
          exit $code

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-searchpanel-403-source
          path: |
            app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
            app/src/main/java/com/simplereader/app/ui/ReaderSearchSupport.kt
            app/src/test/java/com/simplereader/app/ui/ReaderSearchSupportTest.kt
          if-no-files-found: error
          retention-days: 14

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-searchpanel-403
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-searchpanel-403-logs
          path: /tmp/*.log
          if-no-files-found: warn
          retention-days: 3
