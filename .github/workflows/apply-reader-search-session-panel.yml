name: Apply reader search session panel

on:
  push:
    branches:
      - agent/search-session-panel-highlight
    paths:
      - .github/reader-search-session-panel-trigger

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIMPLE_READER_VERSION_CODE: '2026075403'
      SIMPLE_READER_VERSION_NAME: '2026.07.24.v14.searchpanel.403'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/search-session-panel-highlight
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply search panel patch
        run: python scripts/patch_reader_search_session_panel.py

      - name: Debug unit tests
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew clean testDebugUnitTest --stacktrace --console=plain > /tmp/debug-unit.log 2>&1
          code=$?
          tail -n 180 /tmp/debug-unit.log
          exit $code

      - name: Release unit tests
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain > /tmp/release-unit.log 2>&1
          code=$?
          tail -n 180 /tmp/release-unit.log
          exit $code

      - name: Assemble debug
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew assembleDebug --stacktrace --console=plain > /tmp/assemble-debug.log 2>&1
          code=$?
          tail -n 180 /tmp/assemble-debug.log
          exit $code

      - name: Assemble release
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain > /tmp/assemble-release.log 2>&1
          code=$?
          tail -n 180 /tmp/assemble-release.log
          exit $code

      - name: Commit verified ReaderActivity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          if git diff --cached --quiet; then
            echo 'ReaderActivity already patched'
          else
            git commit -m '实现会话式书内搜索面板与命中高亮'
            git push origin HEAD:agent/search-session-panel-highlight
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-searchpanel-403
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-searchpanel-403-logs
          path: /tmp/*.log
          if-no-files-found: warn
          retention-days: 3
