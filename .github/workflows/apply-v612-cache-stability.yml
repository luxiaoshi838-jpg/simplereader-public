name: Apply v612 cache stability fix
on:
  push:
    branches: [fix/v612-cache-stability]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v612-payload/part01 .github/v612-payload/part02 > /tmp/v612.b64
          base64 -d /tmp/v612.b64 | gzip -d > /tmp/v612.patch
          echo 'a467c7466b669a73b6748dcf816a480e8af277aa850150aa09965f5633852765  /tmp/v612.patch' | sha256sum -c -
          git apply --check --ignore-space-change /tmp/v612.patch
          git apply --ignore-space-change /tmp/v612.patch
          bash tools/verify-ui-policy.sh
          rm -rf .github/v612-payload .github/workflows/apply-v612-cache-stability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement v612 persistent cache and stable reader restore'
          git push origin HEAD:fix/v612-cache-stability
