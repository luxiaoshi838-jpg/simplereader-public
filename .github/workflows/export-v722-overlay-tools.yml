name: Export v722 overlay tools

on:
  push:
    branches:
      - main

permissions:
  contents: read

# One-shot tooling export. This workflow never uploads an APK.
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile bounded operation helper only
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -f "$android_jar"
          test -x "$build_tools/d8"
          mkdir -p /tmp/helper-classes /tmp/helper-dex
          javac -source 8 -target 8 -cp "$android_jar" -d /tmp/helper-classes \
            tools/v726/helper/SimpleReaderBackupDecoder/kt.java
          mapfile -t class_files < <(find /tmp/helper-classes -type f -name '*.class' | sort)
          "$build_tools/d8" --min-api 26 --lib "$android_jar" --output /tmp/helper-dex "${class_files[@]}"
          mv /tmp/helper-dex/classes.dex /tmp/classes5.dex
          sha256sum /tmp/classes5.dex | tee /tmp/classes5.sha256

      - name: Pack Android build tools
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          tar -C "$(dirname "$build_tools")" -czf /tmp/android-build-tools.tar.gz "$(basename "$build_tools")"

      - name: Upload DEX and tools only
        uses: actions/upload-artifact@v4
        with:
          name: v722-overlay-tools
          path: |
            /tmp/classes5.dex
            /tmp/classes5.sha256
            /tmp/android-build-tools.tar.gz
          if-no-files-found: error
          retention-days: 1
