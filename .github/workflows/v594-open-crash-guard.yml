name: Build v594 open crash guard

on:
  push:
    branches:
      - agent/v594-open-crash-guard

permissions:
  contents: write

jobs:
  build-v594:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SIMPLE_READER_VERSION_CODE: '2098000594'
      SIMPLE_READER_VERSION_NAME: '2026.08.01.open-crash-guard.594'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v594-open-crash-guard
          fetch-depth: 0

      - name: Materialize v594 source
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m bash -c '
            base64 -d scripts/v594-open-crash-guard.patch.b64 > /tmp/v594.patch
            echo "ad88216d2b803faabab32095ec8b16d396cd4fced06d921a421d45d6c8aff5b7  /tmp/v594.patch" | sha256sum -c -
            git apply --check /tmp/v594.patch
            git apply /tmp/v594.patch

            files=(
              app/src/main/AndroidManifest.xml
              app/src/main/java/com/simplereader/app/SimpleReaderApplication.kt
              app/src/main/java/com/simplereader/app/ui/MainActivity.kt
              app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
              app/src/test/java/com/simplereader/app/ui/ReaderOneClickCacheArchitectureTest.kt
            )
            git add -- "${files[@]}"
            git diff --cached --check
            staged=$(git diff --cached --name-only)
            test "$(printf "%s\n" "$staged" | sed "/^$/d" | wc -l)" -eq 5
            for file in "${files[@]}"; do
              printf "%s\n" "$staged" | grep -Fxq "$file"
            done

            grep -Fq "android:name=\".SimpleReaderApplication\"" app/src/main/AndroidManifest.xml
            grep -Fq "epubChapters = emptyList()" app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
            grep -Fq "txtCatalogChapters = cachedCatalog" app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
            ! grep -A18 -F "val cachedCatalog = cachedChapters.map" app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt | grep -Fq "epubChapters = cachedCatalog"
            grep -Fq "上次崩溃日志" app/src/main/java/com/simplereader/app/ui/MainActivity.kt
            grep -Fq "cachedTxtCatalogNeverBecomesTheVisibleSmallWindowPageAxis" app/src/test/java/com/simplereader/app/ui/ReaderOneClickCacheArchitectureTest.kt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "v594: isolate TXT catalog axis and add crash report"
            git push origin HEAD:agent/v594-open-crash-guard
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test release with five-minute limit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/v594-test.log

      - name: Build release with five-minute limit
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v594-build.log

      - name: Verify v594 APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v594-unsigned.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v594-unsigned.apk | tee /tmp/v594-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v594-badging.log
          grep -Fq "versionCode='2098000594'" /tmp/v594-badging.log
          grep -Fq "versionName='2026.08.01.open-crash-guard.594'" /tmp/v594-badging.log
          "$build_tools/aapt2" dump xmltree /tmp/SimpleReader-v594-unsigned.apk --file AndroidManifest.xml | tee /tmp/v594-manifest.log
          grep -Fq 'com.simplereader.app.SimpleReaderApplication' /tmp/v594-manifest.log
          unzip -t /tmp/SimpleReader-v594-unsigned.apk | tee /tmp/v594-unzip.log
          sha256sum /tmp/SimpleReader-v594-unsigned.apk | tee /tmp/SimpleReader-v594-unsigned.sha256

      - name: Upload v594 APK and logs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v594-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v594-unsigned.apk
            /tmp/v594-test.log
            /tmp/v594-build.log
            /tmp/v594-badging.log
            /tmp/v594-manifest.log
            /tmp/v594-unzip.log
            /tmp/SimpleReader-v594-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
