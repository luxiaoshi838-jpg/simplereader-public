name: Export Android signing tools only

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v655-unified-catalog-rules
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export installed Android build tools
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Using Android build tools: $build_tools"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/aapt2"
          test -f "$build_tools/lib/apksigner.jar"
          mkdir -p /tmp/android-signing-tools/lib
          cp "$build_tools/apksigner" /tmp/android-signing-tools/
          cp "$build_tools/zipalign" /tmp/android-signing-tools/
          cp "$build_tools/aapt2" /tmp/android-signing-tools/
          cp "$build_tools/lib/apksigner.jar" /tmp/android-signing-tools/lib/
          chmod +x /tmp/android-signing-tools/apksigner /tmp/android-signing-tools/zipalign /tmp/android-signing-tools/aapt2
          "$build_tools/apksigner" --version

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v655-signing-tools-linux
          path: /tmp/android-signing-tools
          if-no-files-found: error
          retention-days: 1
