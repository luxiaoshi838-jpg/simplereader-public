name: Apply v614 cache cover and crash update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v614-cache-cover-crash-log'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v614 branch
        uses: actions/checkout@v4
        with:
          ref: v614-cache-cover-crash-log
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Restore and verify exact v614 source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v614-chunks.sha256 <<'EOF'
          6a8c8dcecfd8a491b79e18079c71d09d3d02957491db1a02cf11bbfbacca7f07  .github/v614-payload.part00
          b77869409a45753ae34c810d54bd406d9c71da587b78488dcb90efeddd2cff05  .github/v614-payload.part01
          4ef48397e1f9805dbfac5a99ebb8d181b59b20f54f3ce0bd5376050cd1809667  .github/v614-payload.part02
          d2803efd3dce1384cc3a0085fd362e763cb19d6447f2c27d341fe208f4ac2bc4  .github/v614-payload.part03
          7018e71739bcda349debf774b8d2d885a5c87ff9dbd8ccc66024a67fa15dfbf3  .github/v614-payload.part04
          2c6412a2630dea71d77c5da967794f621105b32f09a063fd06e8dee99e563c13  .github/v614-payload.part05
          d53cb5f40729fcd0f2f417fb9c1d5c223f777d21c0a54b1f1e52b709cacf15ec  .github/v614-payload.part06
          474b4439937ab88a75eb539faa993dbcbe49a2586e67509ed1dd400897f4c11b  .github/v614-payload.part07
          8ca9602749863f446085d15d87fdc9eef0e454d2adfd528ccc11ef05560865fe  .github/v614-payload.part08
          fc52f4a96dc936430a57c6346556043f8ee8e61742ce0141039add9574c706b8  .github/v614-payload.part09
          EOF
          sha256sum -c /tmp/v614-chunks.sha256
          cat .github/v614-payload.part{00..09} > /tmp/v614-payload.tar.xz
          echo '7d8bb59d1b7875f97f42f7c40cf2b9f41448487be9b9ac8a9cd7f1548b0a3fbe  /tmp/v614-payload.tar.xz' | sha256sum -c -
          xz -t /tmp/v614-payload.tar.xz
          tar -tJf /tmp/v614-payload.tar.xz > /tmp/v614-files.list
          test "$(wc -l < /tmp/v614-files.list)" -eq 34
          tar -xJf /tmp/v614-payload.tar.xz

          rm -f \
            app/src/main/java/com/simplereader/app/ui/PaperCoverDrawable.kt \
            app/src/main/res/drawable-nodpi/reader_texture_paper_grain.png \
            app/src/main/res/drawable-nodpi/reader_texture_paper_fiber.png \
            app/src/main/res/drawable-nodpi/reader_material_frosted.png

          grep -q '2098000614' app/build.gradle.kts
          grep -q 'generatedVersionName = System.getenv("SIMPLE_READER_VERSION_NAME") ?: "614"' app/build.gradle.kts
          grep -q 'arrayOf("全书架目录缓存", "全书架无目录书籍缓存")' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -q 'val text = cached.text' app/src/main/java/com/simplereader/app/reader/ReaderDocumentLoader.kt
          ! grep -q 'cached.catalogRuleVersion == TxtParser.CATALOG_RULE_VERSION' app/src/main/java/com/simplereader/app/reader/ReaderDocumentLoader.kt
          ! grep -q 'root.optInt("catalogRuleVersion", 0) == identity.catalogRuleVersion' app/src/main/java/com/simplereader/app/reader/page/PageCacheStore.kt
          grep -Fq '[\p{script=Han}]{1,40}[（(]' app/src/main/java/com/simplereader/app/parser/TxtParser.kt
          grep -q 'CrashLogStore.install(this)' app/src/main/java/com/simplereader/app/App.kt
          grep -q '闪退/崩溃日志' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -q 'const val TOP_GUARD_DP = 0' app/src/main/java/com/simplereader/app/reader/page/ReaderCacheProfile.kt
          grep -q 'const val CONTENT_TOP_PADDING_DP = 50' app/src/main/java/com/simplereader/app/reader/page/ReaderCacheProfile.kt
          test -f app/src/main/res/drawable-nodpi/book_cover_default_txt.webp
          test -f app/src/main/res/drawable-nodpi/book_cover_default_epub.webp
          test -f app/src/main/res/drawable-nodpi/reader_texture_duokan_blue.webp
          test -f app/src/main/res/drawable-nodpi/reader_material_duokan_paper.webp
          python3 - <<'PY'
          from pathlib import Path
          layout = Path('app/src/main/res/layout/activity_reader.xml').read_text()
          root = layout.split('>', 1)[0]
          assert 'android:paddingTop' not in root, root
          content = layout.split('@+id/contentView', 1)[1].split('/>', 1)[0]
          assert 'android:paddingTop="50dp"' in content, content
          PY
          bash tools/verify-ui-policy.sh

      - name: Debug unit tests
        shell: bash
        run: timeout --signal=INT 5m ./gradlew clean testDebugUnitTest --stacktrace --console=plain

      - name: Commit verified v614 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/v614-payload.tar.gz .github/v614-payload.part{00..09} .github/workflows/apply-v614.yml
          git add -A
          git commit -m 'v614: persist catalogs, use supplied covers and backgrounds, and retain crash logs'
          git push origin HEAD:v614-cache-cover-crash-log
