name: v598 reader-only Duokan build

on:
  push:
    branches: [agent/v598-reader-only-duokan]
  pull_request:
    branches: [baseline/v575]

permissions:
  contents: write

concurrency:
  group: v598-reader-only-duokan
  cancel-in-progress: true

jobs:
  build-v598:
    if: github.event_name == 'push' || github.head_ref == 'agent/v598-reader-only-duokan'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SIMPLE_READER_VERSION_CODE: '2098000598'
      SIMPLE_READER_VERSION_NAME: '2026.08.02.reader-only-duokan.598'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v598-reader-only-duokan
          fetch-depth: 0

      - name: Materialize reader-only source
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'private fun openFixedTxtAtSourceOffset' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt; then
            echo 'v598 reader source already materialized'
          else
            timeout --signal=INT 5m bash -c '
              base64 -d scripts/v598-reader-only.patch.gz.b64 > /tmp/v598-reader-only.patch.gz
              gzip -dc /tmp/v598-reader-only.patch.gz > /tmp/v598-reader-only.patch
              echo "5c5384ff1f6288f26fbcf215d03e4eb9366357e62e18fe57f4f2200e84014793  /tmp/v598-reader-only.patch" | sha256sum -c -
              git apply --check /tmp/v598-reader-only.patch
              git apply /tmp/v598-reader-only.patch
            '
          fi
          actual=$(git status --porcelain | sed -E 's/^.. //' | grep -E '^app/' | sort || true)
          expected=$(printf '%s\n' \
            app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
            app/src/main/java/com/simplereader/app/ui/ReaderPageIndexStore.kt \
            app/src/main/java/com/simplereader/app/ui/ReaderPageModel.kt \
            app/src/main/res/layout/activity_reader.xml \
            app/src/test/java/com/simplereader/app/ui/ReaderOnlyDuokanPaginationContractTest.kt | sort)
          test "$actual" = "$expected" || { echo 'Reader-only whitelist failed'; printf '%s\n' "$actual"; exit 1; }
          grep -Fq 'ReaderTextPaginator.paginate' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'android:fitsSystemWindows="true"' app/src/main/res/layout/activity_reader.xml
          grep -Fq 'android:scrollbars="none"' app/src/main/res/layout/activity_reader.xml
          ! grep -Fq 'readerScrollView.isScrollbarFadingEnabled = false' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Test release within five minutes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/v598-test.log

      - name: Build release within five minutes
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v598-build.log

      - name: Verify APK and commit reader source
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v598-unsigned.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v598-unsigned.apk | tee /tmp/v598-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v598-badging.log
          grep -Fq "versionCode='2098000598'" /tmp/v598-badging.log
          grep -Fq "versionName='2026.08.02.reader-only-duokan.598'" /tmp/v598-badging.log
          unzip -t /tmp/SimpleReader-v598-unsigned.apk | tee /tmp/v598-unzip.log
          sha256sum /tmp/SimpleReader-v598-unsigned.apk | tee /tmp/SimpleReader-v598-unsigned.sha256
          files=(app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt app/src/main/java/com/simplereader/app/ui/ReaderPageIndexStore.kt app/src/main/java/com/simplereader/app/ui/ReaderPageModel.kt app/src/main/res/layout/activity_reader.xml app/src/test/java/com/simplereader/app/ui/ReaderOnlyDuokanPaginationContractTest.kt)
          git add -- "${files[@]}"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'v598: replace reader TXT estimates with fixed chapter pages'
            git push origin HEAD:agent/v598-reader-only-duokan
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v598-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v598-unsigned.apk
            /tmp/v598-test.log
            /tmp/v598-build.log
            /tmp/v598-badging.log
            /tmp/v598-unzip.log
            /tmp/SimpleReader-v598-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
