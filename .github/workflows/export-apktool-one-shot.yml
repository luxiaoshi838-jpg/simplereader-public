name: Export apktool one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-apktool-one-shot.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  /tmp/apktool.jar' | sha256sum -c -
      - name: Upload apktool
        uses: actions/upload-artifact@v4
        with:
          name: apktool-2.11.1
          path: /tmp/apktool.jar
          if-no-files-found: error
          retention-days: 1
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/export-apktool-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Remove temporary apktool export workflow'
          git push origin HEAD:main
