name: Build final v615 APK

on:
  push:
    branches:
      - agent/v615-reader-stability
    paths:
      - .github/workflows/build-final-v615.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'Record final v615 run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          printf '%s\n' "$GITHUB_RUN_ID" > .automation/final-v615-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .automation/final-v615-run.txt
          git commit -m 'Record final v615 run'
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply and verify six-category v615 fixes
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_final_v615_bounds.py
          git diff --check
          bash tools/verify-ui-policy.sh
          grep -n 'WindowCompat.setDecorFitsSystemWindows\|statusBarInsetPx + oneCharacterPx\|navigationBarInsetPx + oneCharacterPx' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          test ! -e app/src/main/res/drawable-nodpi/book_cover_default_txt.webp
          grep -q '（(][^（）()' app/src/main/java/com/simplereader/app/parser/TxtParser.kt
          grep -q 'renderContinuousWindow' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'MANIFEST_PREFIX' app/src/main/java/com/simplereader/app/reader/page/PageCacheStore.kt
          grep -q 'CrashLogStore' app/src/main/java/com/simplereader/app/App.kt
      - name: Build final release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          timeout --signal=INT 5m ./gradlew clean assembleRelease --stacktrace --console=plain
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v615-final-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
      - name: Commit verified source and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/final-v615-run.txt .github/workflows/build-final-v615.yml tools/apply_final_v615_bounds.py
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'v615: finalize six reader fixes and system-bar bounds'
          git push
