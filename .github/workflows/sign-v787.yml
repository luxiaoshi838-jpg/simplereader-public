name: Build 简阅 v787 for local signing

on:
  push:
    branches:
      - source-v787
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v787-local-signing
  cancel-in-progress: true

env:
  SIMPLE_READER_VERSION_CODE: "2098000787"
  SIMPLE_READER_VERSION_NAME: "787"
  MAX_APK_BYTES: "52428800"

jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v787
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce source and UI policy
        shell: bash
        run: |
          set -euo pipefail
          bash tools/verify-no-apk.sh
          bash tools/verify-ui-policy.sh
          grep -Fq '2098000787' app/build.gradle.kts
          grep -Fq 'generatedVersionName = System.getenv("SIMPLE_READER_VERSION_NAME") ?: "787"' app/build.gradle.kts

      - name: Run v787 shelf regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --tests 'com.simplereader.app.ui.ShelfV787ContractTest' --stacktrace --console=plain
          ./gradlew testReleaseUnitTest --tests 'com.simplereader.app.ui.ShelfV787ContractTest' --stacktrace --console=plain

      - name: Check full unit suite against inherited known-failure baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/v759-full-unit-baseline-gate.sh
          bash tools/v759-full-unit-baseline-gate.sh v787-full-unit-tests.log

      - name: Build debug and release v787
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Verify unsigned package and bundle local signing tools
        shell: bash
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -s "$unsigned" ] || unsigned="app/build/outputs/apk/release/app-release.apk"
          test -s "$unsigned"
          mkdir -p release signing-tools/lib
          cp "$unsigned" release/SimpleReader_v787_unsigned.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${build_tools}/aapt2" dump badging "$unsigned" | tee apk-package-info.txt
          grep -Fq "package: name='com.simplereader.app'" apk-package-info.txt
          grep -Fq "versionCode='2098000787'" apk-package-info.txt
          grep -Fq "versionName='787'" apk-package-info.txt
          test "$(stat -c %s "$unsigned")" -le "$MAX_APK_BYTES"
          sha256sum "$unsigned" | tee apk-unsigned-sha256.txt
          cp "${build_tools}/apksigner" signing-tools/apksigner
          cp "${build_tools}/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp "${build_tools}/aapt2" signing-tools/aapt2
          chmod +x signing-tools/apksigner signing-tools/aapt2
          signing-tools/apksigner version | tee apksigner-version.txt

      - name: Upload unsigned v787 and public Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v787-unsigned-tools-${{ github.run_number }}
          path: |
            release/SimpleReader_v787_unsigned.apk
            signing-tools/apksigner
            signing-tools/lib/apksigner.jar
            signing-tools/aapt2
            apk-package-info.txt
            apk-unsigned-sha256.txt
            apksigner-version.txt
            gradle-build.log
            v787-full-unit-tests.log
          if-no-files-found: error
          retention-days: 7
