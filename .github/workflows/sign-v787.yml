name: Sign 简阅 v787

on:
  push:
    branches:
      - source-v787
  workflow_dispatch:

permissions:
  contents: read

env:
  SIMPLE_READER_VERSION_CODE: "2098000787"
  SIMPLE_READER_VERSION_NAME: "787"
  EXPECTED_SIGNING_SHA256: "315d7bbf06b2a0a16ea7efd7a5c7cd8e6371ab9b0f40ae380cc416e1472c8648"
  SIGNING_ALIAS: "simplereader-public-v1"
  MAX_APK_BYTES: "52428800"

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v787
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore and verify protected signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIMPLEREADER_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIMPLEREADER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_PASSWORD"
          key="$RUNNER_TEMP/simplereader-public-v1.keystore"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$key"
          test -s "$key"
          actual="$(keytool -list -v -keystore "$key" -storepass "$SIGNING_PASSWORD" -alias "$SIGNING_ALIAS" 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':\r\n ' | tr 'A-F' 'a-f')"
          test "$actual" = "$EXPECTED_SIGNING_SHA256"
          echo "SIGNING_KEYSTORE=$key" >> "$GITHUB_ENV"

      - name: Enforce source and UI policy
        shell: bash
        run: |
          set -euo pipefail
          bash tools/verify-no-apk.sh
          bash tools/verify-ui-policy.sh
          grep -Fq '2098000787' app/build.gradle.kts
          grep -Fq 'generatedVersionName = System.getenv("SIMPLE_READER_VERSION_NAME") ?: "787"' app/build.gradle.kts

      - name: Run v787 shelf regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --tests 'com.simplereader.app.ui.ShelfV787ContractTest' --stacktrace --console=plain
          ./gradlew testReleaseUnitTest --tests 'com.simplereader.app.ui.ShelfV787ContractTest' --stacktrace --console=plain

      - name: Check full unit suite against inherited known-failure baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/v759-full-unit-baseline-gate.sh
          bash tools/v759-full-unit-baseline-gate.sh v787-full-unit-tests.log

      - name: Build debug and release v787
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Sign and verify v787
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIMPLEREADER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -s "$unsigned" ] || unsigned="app/build/outputs/apk/release/app-release.apk"
          test -s "$unsigned"
          out="app/build/outputs/apk/release/SimpleReader_v787_signed.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${build_tools}/apksigner" sign \
            --ks "$SIGNING_KEYSTORE" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$out" "$unsigned"
          "${build_tools}/apksigner" verify --verbose --print-certs "$out" | tee apk-certificate.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-certificate.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' apk-certificate.txt
          actual="$(sed -n 's/.*certificate SHA-256 digest: //p' apk-certificate.txt | head -n1 | tr -d ':\r\n ' | tr 'A-F' 'a-f')"
          test "$actual" = "$EXPECTED_SIGNING_SHA256"
          "${build_tools}/aapt2" dump badging "$out" | tee apk-package-info.txt
          grep -Fq "package: name='com.simplereader.app'" apk-package-info.txt
          grep -Fq "versionCode='2098000787'" apk-package-info.txt
          grep -Fq "versionName='787'" apk-package-info.txt
          test "$(stat -c %s "$out")" -le "$MAX_APK_BYTES"
          sha256sum "$out" | tee apk-sha256.txt

      - name: Upload signed v787
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v787-signed-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/SimpleReader_v787_signed.apk
            apk-certificate.txt
            apk-package-info.txt
            apk-sha256.txt
            gradle-build.log
            v787-full-unit-tests.log
          if-no-files-found: error
          retention-days: 7
