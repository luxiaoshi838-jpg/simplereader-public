name: v754 Export source-v748 Snapshot

on:
  push:
    branches: [source-v754]
    paths:
      - 'recovery/v754/EXPORT_V748_TRIGGER'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source-v748
        uses: actions/checkout@v4
        with:
          ref: source-v748
          fetch-depth: 1

      - name: Record source commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee SOURCE_V748_COMMIT.txt
          test "$(git rev-parse HEAD)" = "d13fbe3a22397bcb4e6c5773441d241494a57584"

      - name: Archive working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          zip -qr /tmp/source-v748-snapshot.zip .
          sha256sum /tmp/source-v748-snapshot.zip | tee /tmp/source-v748-snapshot.sha256

      - name: Upload source-v748 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-v748-snapshot
          path: |
            /tmp/source-v748-snapshot.zip
            /tmp/source-v748-snapshot.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
