name: v754 Export source-v753 Snapshot

on:
  push:
    branches: [source-v754]
    paths:
      - 'recovery/v754/EXPORT_V753_TRIGGER'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source-v753-restore
        uses: actions/checkout@v4
        with:
          ref: source-v753-restore
          fetch-depth: 1

      - name: Record source commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee SOURCE_V753_RESTORE_COMMIT.txt

      - name: Archive working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          zip -qr /tmp/source-v753-restore-snapshot.zip .
          sha256sum /tmp/source-v753-restore-snapshot.zip | tee /tmp/source-v753-restore-snapshot.sha256

      - name: Upload source-v753 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-v753-restore-snapshot
          path: |
            /tmp/source-v753-restore-snapshot.zip
            /tmp/source-v753-restore-snapshot.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
