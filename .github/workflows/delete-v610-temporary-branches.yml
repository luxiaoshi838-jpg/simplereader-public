name: Delete v610 temporary branches

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'maintenance/delete-v610-temporary-branches'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete only completed v610 temporary refs
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            fix/v610-confirmed-reader-ui \
            temp/export-v599-confirmed-source \
            temp/trigger-v599-export
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
          git push origin --delete "$GITHUB_HEAD_REF" || true
