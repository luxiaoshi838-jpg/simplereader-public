name: Export Gradle 8.2.1 for v622

on:
  push:
    branches:
      - agent/v622-gradle-export
    paths:
      - .github/workflows/export-v622-gradle.yml

permissions:
  contents: write

jobs:
  export:
    if: github.event.head_commit.message != 'Record v622 Gradle run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          printf '%s\n' "$GITHUB_RUN_ID" > .automation/v622-gradle-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .automation/v622-gradle-run.txt
          git commit -m 'Record v622 Gradle run'
          git push
      - name: Download fixed Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s curl -fL --retry 2 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.2.1-bin.zip \
            -o /tmp/gradle-8.2.1-bin.zip
          unzip -t /tmp/gradle-8.2.1-bin.zip >/dev/null
          sha256sum /tmp/gradle-8.2.1-bin.zip > /tmp/gradle-8.2.1-bin.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-8.2.1-v622
          path: |
            /tmp/gradle-8.2.1-bin.zip
            /tmp/gradle-8.2.1-bin.zip.sha256
          if-no-files-found: error
          retention-days: 1
