name: Apply v613 regression fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v613-reader-update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v613-reader-update
          fetch-depth: 0

      - name: Verify and apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          echo '5aaadfcc09a96f5cdc280fac5d2e6554defa3dce9351d467601fd2284fb22d70  .github/v613-test-fix.patch' | sha256sum -c -
          git apply --check .github/v613-test-fix.patch
          git apply .github/v613-test-fix.patch
          grep -q 'fallbackSentenceMarkers' app/src/main/java/com/simplereader/app/parser/TxtParser.kt
          grep -q 'profile.contains("contentPaddingBottomPx = 0")' app/src/test/java/com/simplereader/app/ui/UiRegressionPolicyTest.kt
          bash tools/verify-ui-policy.sh

      - name: Commit fixed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/v613-test-fix.patch .github/workflows/apply-v613-test-fix.yml
          git add -A
          git commit -m 'Fix v613 chapter fallback and current layout regression tests'
          git push origin HEAD:v613-reader-update
