name: Android PR validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: android-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: v582 signed release validation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SIMPLE_READER_VERSION_CODE: '2098000582'
      SIMPLE_READER_VERSION_NAME: '2026.07.31.duokan-backgrounds.582'
      EXPECTED_CERT_SHA256: '315d7bbf06b2a0a16ea7efd7a5c7cd8e6371ab9b0f40ae380cc416e1472c8648'

    steps:
      - name: Checkout v582 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v581 baseline and v582 source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v582_v581_backgrounds.py
          python3 scripts/fix_v582_compile.py
          python3 scripts/disable_v582_text_selection.py

      - name: Use the established SimpleReader signing identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          old = '''        release {
                      if (permanentSigningConfigured) {
                          signingConfig = signingConfigs.getByName("permanentV2")
                      }
                      isMinifyEnabled = true'''
          if old not in text:
              old = '''        release {
                  if (permanentSigningConfigured) {
                      signingConfig = signingConfigs.getByName("permanentV2")
                  }
                  isMinifyEnabled = true'''
          new = '''        release {
                  signingConfig = if (permanentSigningConfigured) {
                      signingConfigs.getByName("permanentV2")
                  } else {
                      signingConfigs.getByName("debug")
                  }
                  isMinifyEnabled = true'''
          if old not in text:
              raise SystemExit('release signing block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Guard v581 baseline and v582 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD e47b8c6a2a596a622cef298009f83d5e2a8353dc)" = "e47b8c6a2a596a622cef298009f83d5e2a8353dc"
          grep -q 'private var shelfSelectionMode = false' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -q 'confirmDeleteShelfSelection' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -q 'confirmDeleteSelection' app/src/main/java/com/simplereader/app/ui/GroupBooksActivity.kt
          grep -q 'ReaderBackgroundPicker.show' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'ReaderBackgrounds.drawable(activePreset)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'readerProgressLabel.setTextColor(currentTextColor)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'private const val PREF_BACKGROUND_STYLE' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'private const val CHROME_ACTIVATION_LONG_PRESS' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'contentView.setTextIsSelectable(false)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'contentView.isLongClickable = false' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'android:textIsSelectable="false"' app/src/main/res/layout/activity_reader.xml
          grep -q 'android:longClickable="false"' app/src/main/res/layout/activity_reader.xml
          grep -q '@+id/themeMoreButton' app/src/main/res/layout/activity_reader.xml
          grep -q '@+id/chromeCenterButton' app/src/main/res/layout/activity_reader.xml
          grep -q '@+id/chromeLongPressButton' app/src/main/res/layout/activity_reader.xml
          grep -q 'SOLID("纯色")' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          grep -q 'TEXTURE("纹理")' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          grep -q 'MATERIAL("质感")' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          grep -q 'val unitsPerPage = pageSize.toLong().coerceAtLeast(1L)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          ! grep -q 'readerScrollView.scrollY / pageHeight' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          ! grep -q 'android:background="#33FFFFFF"' app/src/main/res/layout/activity_reader.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Release unit tests within five minutes
        shell: bash
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew testReleaseUnitTest --stacktrace --console=plain > /tmp/test-release.log 2>&1
          code=$?
          tail -n 220 /tmp/test-release.log
          exit $code

      - name: Assemble signed release within five minutes
        shell: bash
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain > /tmp/assemble-release.log 2>&1
          code=$?
          tail -n 260 /tmp/assemble-release.log
          exit $code

      - name: Verify package parsing, alignment and signing identity
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v582.apk
          "$build_tools/apksigner" verify --verbose --print-certs /tmp/SimpleReader-v582.apk | tee /tmp/apksigner-verify.log
          cert=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}' /tmp/apksigner-verify.log)
          echo "Signer certificate: $cert" | tee /tmp/signing-certificate.log
          test "$cert" = "$EXPECTED_CERT_SHA256"
          "$build_tools/zipalign" -c -P 16 4 /tmp/SimpleReader-v582.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v582.apk | tee /tmp/aapt2-badging.log
          sha256sum /tmp/SimpleReader-v582.apk | tee /tmp/SimpleReader-v582.sha256

      - name: Upload v582 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v582-signed-logs-${{ github.run_number }}
          path: |
            /tmp/test-release.log
            /tmp/assemble-release.log
            /tmp/signing-certificate.log
            /tmp/apksigner-verify.log
            /tmp/aapt2-badging.log
            /tmp/SimpleReader-v582.sha256
          if-no-files-found: warn
          retention-days: 3

      - name: Upload signed v582 APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v582-signed-${{ github.run_number }}
          path: /tmp/SimpleReader-v582.apk
          if-no-files-found: error
          retention-days: 7
