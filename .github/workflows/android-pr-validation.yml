name: Android PR validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: android-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-v615:
    name: Apply verified v615 payload
    if: github.head_ref == 'agent/v615-reader-stability' || github.ref == 'refs/heads/agent/v615-reader-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v615 working branch
        uses: actions/checkout@v4
        with:
          ref: agent/v615-reader-stability
          fetch-depth: 0

      - name: Apply source, covers, and supplied full-size textures
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/v615-patch.part* | base64 -d | gzip -d > /tmp/v615.patch
          git apply --check --exclude=.github/workflows/export-agent-source.yml /tmp/v615.patch
          git apply --exclude=.github/workflows/export-agent-source.yml /tmp/v615.patch

          mkdir -p app/src/main/res/drawable-nodpi
          cat .automation/v615-cover.part* | base64 -d > app/src/main/res/drawable-nodpi/book_cover_default_generic.webp
          rm -f app/src/main/res/drawable-nodpi/book_cover_default_txt.webp

          bash tools/verify-ui-policy.sh

          git fetch origin main
          git checkout origin/main -- .github/workflows/android-pr-validation.yml
          rm -f .automation/v615-* \
            .github/workflows/apply-v615-reader-fix.yml \
            .github/workflows/apply-v615-through-pr.yml \
            .github/workflows/export-agent-source.yml

          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "v615: stabilize large-book reading and restore supplied textures"
          git push origin HEAD:agent/v615-reader-stability
