name: Android PR validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: android-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Five-minute release validation
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply v578 cover and page-number patch
        shell: bash
        run: |
          git apply --check patches/v578/cover-page-unified.patch
          git apply patches/v578/cover-page-unified.patch
          echo "SIMPLE_READER_VERSION_CODE=2098000578" >> "$GITHUB_ENV"
          echo "SIMPLE_READER_VERSION_NAME=2026.07.30.cover-second-page-unified.578" >> "$GITHUB_ENV"

      - name: Assemble release within five minutes
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 5m ./gradlew --no-daemon assembleRelease --stacktrace --console=plain > /tmp/assemble-release.log 2>&1
          code=$?
          tail -n 220 /tmp/assemble-release.log
          exit $code

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-validation-logs-${{ github.run_number }}
          path: /tmp/assemble-release.log
          if-no-files-found: warn
          retention-days: 2

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-validation-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
