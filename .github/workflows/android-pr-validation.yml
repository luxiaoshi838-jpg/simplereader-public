name: Android PR validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: android-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: v586 stable-signed release validation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SIMPLE_READER_VERSION_CODE: '2098000586'
      SIMPLE_READER_VERSION_NAME: '2026.07.31.background-strength.586'
      EXPECTED_CERT_SHA256: '315d7bbf06b2a0a16ea7efd7a5c7cd8e6371ab9b0f40ae380cc416e1472c8648'
      SIGNING_ALIAS: 'simplereader-public-v1'

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore encrypted stable signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIMPLEREADER_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIMPLEREADER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_PASSWORD"
          keystore="$RUNNER_TEMP/simplereader-public-v1.keystore"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$keystore"
          actual=$(keytool -list -v -keystore "$keystore" -storepass "$SIGNING_PASSWORD" -alias "$SIGNING_ALIAS" 2>/dev/null \
            | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':\r\n ' | tr 'A-F' 'a-f')
          echo "Signer certificate: $actual" | tee /tmp/signing-certificate.log
          test "$actual" = "$EXPECTED_CERT_SHA256"
          {
            echo "SIMPLEREADER_KEYSTORE_PATH=$keystore"
            echo "SIMPLEREADER_KEYSTORE_PASSWORD=$SIGNING_PASSWORD"
            echo "SIMPLEREADER_KEY_ALIAS=$SIGNING_ALIAS"
            echo "SIMPLEREADER_KEY_PASSWORD=$SIGNING_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify v586 background contract
        shell: bash
        run: |
          set -euo pipefail
          background=app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt
          grep -Fq 'ColorOption("solid_ivory", "纸张", Color.rgb(245, 233, 200), Color.rgb(59, 52, 40))' "$background"
          grep -Fq 'ColorOption("solid_eye", "护眼", Color.rgb(218, 238, 205), Color.rgb(48, 60, 42))' "$background"
          grep -Fq 'ColorOption("solid_white", "白色", Color.WHITE, Color.rgb(35, 35, 35))' "$background"
          grep -Fq 'alpha = 188' "$background"
          grep -Fq 'alpha = 205' "$background"
          grep -Fq 'alpha = 152' "$background"
          grep -Fq 'PorterDuff.Mode.MULTIPLY' "$background"
          ! grep -Fq '旧纸质感' "$background"
          ! grep -Fq 'PATINA' "$background"
          ! grep -Fq 'reader_material_patina' "$background"
          test ! -e app/src/main/res/drawable-nodpi/reader_material_patina.png
          test -s app/src/main/res/drawable-nodpi/reader_texture_paper_grain.png
          test -s app/src/main/res/drawable-nodpi/reader_texture_paper_fiber.png
          test -s app/src/main/res/drawable-nodpi/reader_material_frosted.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble stable-signed release
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 6m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/test-release.log
          timeout --signal=INT 6m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/assemble-release.log

      - name: Verify v586 package, resources and certificate
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          cp app/build/outputs/apk/release/app-release.apk /tmp/SimpleReader-v586-stable.apk
          "$build_tools/apksigner" verify --verbose --print-certs /tmp/SimpleReader-v586-stable.apk | tee /tmp/apksigner-verify.log
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner-verify.log
          cert=$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/apksigner-verify.log | head -n 1 | tr -d ':\r\n ' | tr 'A-F' 'a-f')
          echo "Final APK certificate: $cert" | tee -a /tmp/signing-certificate.log
          test "$cert" = "$EXPECTED_CERT_SHA256"
          "$build_tools/zipalign" -c -P 16 4 /tmp/SimpleReader-v586-stable.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v586-stable.apk | tee /tmp/aapt2-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/aapt2-badging.log
          grep -Fq "versionCode='2098000586'" /tmp/aapt2-badging.log
          "$build_tools/aapt2" dump resources /tmp/SimpleReader-v586-stable.apk | tee /tmp/aapt2-resources.log
          grep -Fq 'drawable/reader_texture_paper_grain' /tmp/aapt2-resources.log
          grep -Fq 'drawable/reader_texture_paper_fiber' /tmp/aapt2-resources.log
          grep -Fq 'drawable/reader_material_frosted' /tmp/aapt2-resources.log
          ! grep -Fq 'drawable/reader_material_patina' /tmp/aapt2-resources.log
          sha256sum /tmp/SimpleReader-v586-stable.apk | tee /tmp/SimpleReader-v586-stable.sha256

      - name: Upload v586 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v586-stable-logs-${{ github.run_number }}
          path: |
            /tmp/test-release.log
            /tmp/assemble-release.log
            /tmp/signing-certificate.log
            /tmp/apksigner-verify.log
            /tmp/aapt2-badging.log
            /tmp/aapt2-resources.log
            /tmp/SimpleReader-v586-stable.sha256
          if-no-files-found: warn
          retention-days: 3

      - name: Upload stable-signed v586 APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v586-stable-${{ github.run_number }}
          path: /tmp/SimpleReader-v586-stable.apk
          if-no-files-found: error
          retention-days: 7
