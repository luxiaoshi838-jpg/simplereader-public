name: Android PR validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: android-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: v575 texture-only release build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact v575 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only reader texture and unified page source
        shell: bash
        run: |
          python3 scripts/apply_v579_v575_texture_page.py

      - name: Guard v575 functionality and modification scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD e47b8c6a2a596a622cef298009f83d5e2a8353dc)" = "e47b8c6a2a596a622cef298009f83d5e2a8353dc"
          grep -q 'private var shelfSelectionMode = false' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -q 'confirmDeleteShelfSelection' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -q 'confirmDeleteSelection' app/src/main/java/com/simplereader/app/ui/GroupBooksActivity.kt
          grep -q 'contentView.background = PaperPageDrawable' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'val unitsPerPage = pageSize.toLong().coerceAtLeast(1L)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          ! grep -q 'readerScrollView.scrollY / pageHeight' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          allowed='^(\.github/workflows/android-pr-validation.yml|scripts/apply_v579_v575_texture_page.py|app/src/main/java/com/simplereader/app/ui/PaperCoverDrawable.kt|app/src/main/java/com/simplereader/app/ui/PaperPageDrawable.kt|app/src/main/java/com/simplereader/app/ui/PaperTextureData.kt|app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt)$'
          unexpected=$(git diff --name-only e47b8c6a2a596a622cef298009f83d5e2a8353dc | grep -Ev "$allowed" || true)
          test -z "$unexpected" || { echo "Unexpected changes:"; echo "$unexpected"; exit 1; }

      - name: Set v579 version
        shell: bash
        run: |
          echo "SIMPLE_READER_VERSION_CODE=2098000579" >> "$GITHUB_ENV"
          echo "SIMPLE_READER_VERSION_NAME=2026.07.31.v575-paper-texture.579" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release within five minutes
        shell: bash
        run: |
          set +e
          timeout --signal=INT 5m ./gradlew clean assembleRelease --stacktrace --console=plain > /tmp/assemble-release.log 2>&1
          code=$?
          tail -n 220 /tmp/assemble-release.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v579-v575-logs-${{ github.run_number }}
          path: /tmp/assemble-release.log
          if-no-files-found: warn
          retention-days: 2

      - name: Upload v579 APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v579-v575-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
