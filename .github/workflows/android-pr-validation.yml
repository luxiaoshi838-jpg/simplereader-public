name: Materialize v592 through PR validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-v592-pr
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/v592-demand-page-controller' || github.ref_name == 'agent/v592-demand-page-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout v592 staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/v592-demand-page-controller
          fetch-depth: 0

      - name: Materialize direct source commit
        shell: bash
        run: |
          set -euxo pipefail
          for part in 00 01 02 03; do
            test -s "scripts/v592_materialize.part${part}"
          done

          cat scripts/v592_materialize.part00 \
              scripts/v592_materialize.part01 \
              scripts/v592_materialize.part02 \
              scripts/v592_materialize.part03 \
            | base64 --decode | gzip --decompress > /tmp/v592.patch

          base=6159c37699e9aca7d15ee20035ca0d2163f3822a
          git show "$base":.github/workflows/public-ci.yml > .github/workflows/public-ci.yml
          git show "$base":.github/workflows/android-pr-validation.yml > .github/workflows/android-pr-validation.yml
          git apply --whitespace=nowarn --check /tmp/v592.patch
          git apply --whitespace=nowarn /tmp/v592.patch

          rm -f scripts/v592_materialize.part00 \
                scripts/v592_materialize.part01 \
                scripts/v592_materialize.part02 \
                scripts/v592_materialize.part03

          grep -Fn 'class ReaderPageCacheWorker' app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheWorker.kt
          grep -Fn 'ExistingWorkPolicy.KEEP' app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheManager.kt
          grep -Fn 'ReaderPageBoundaryCalculator' app/src/main/java/com/simplereader/app/ui/ReaderPageModel.kt
          grep -Fn 'MENU_CACHE_BOOK' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fn 'work-runtime-ktx' app/build.gradle.kts
          grep -Fn 'foregroundServiceType="dataSync"' app/src/main/AndroidManifest.xml
          grep -Fn '2098000592' .github/workflows/public-ci.yml
          git status --short

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v592: materialize demand paging and background page cache'
          git push origin HEAD:agent/v592-demand-page-controller
