name: Android PR validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: android-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-v615:
    name: Install supplied base texture and clean temporary files
    if: github.head_ref == 'agent/v615-reader-stability' || github.ref == 'refs/heads/agent/v615-reader-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v615 working branch
        uses: actions/checkout@v4
        with:
          ref: agent/v615-reader-stability
          fetch-depth: 0

      - name: Install exact full-page texture
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/v615-green.part* | base64 -d > app/src/main/res/drawable-nodpi/reader_texture_duokan_green.webp
          echo 'bfec86bd9afbd288720187e3cc631ea98eb65c506271765cec4a2f693f82bfb5  app/src/main/res/drawable-nodpi/reader_texture_duokan_green.webp' | sha256sum -c -

          rm -f \
            app/src/main/res/drawable-nodpi/reader_texture_duokan_blue.webp \
            app/src/main/res/drawable-nodpi/reader_texture_duokan_white.webp \
            app/src/main/res/drawable-nodpi/reader_texture_duokan_yellow.webp

          bash tools/verify-ui-policy.sh

          git fetch origin main
          git checkout origin/main -- .github/workflows/android-pr-validation.yml
          rm -f .automation/v615-* \
            .github/workflows/apply-v615-reader-fix.yml \
            .github/workflows/apply-v615-through-pr.yml \
            .github/workflows/export-agent-source.yml

          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "v615: replace circle thumbnails with supplied base texture"
          git push origin HEAD:agent/v615-reader-stability
