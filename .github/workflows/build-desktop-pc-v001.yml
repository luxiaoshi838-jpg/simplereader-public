name: Build SimpleReader PC v0.1

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop-pc-v001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Verify desktop contract
        shell: pwsh
        run: |
          $src = Get-Content 'desktop/src/main/java/com/simplereader/pc/SimpleReaderPc.java' -Raw
          if ($src -notmatch 'Overlay-only') { throw 'Reader bars must remain overlays' }
          if ($src -notmatch 'Paginator.paginate') { throw 'Real viewport pagination missing' }
          if ($src -notmatch '上一章') { throw 'Chapter navigation missing' }
          if ($src -notmatch '全文搜索') { throw 'Book search missing' }
          $loader = Get-Content 'desktop/src/main/java/com/simplereader/pc/BookLoader.java' -Raw
          foreach ($format in @('txt','epub','chm','docx','odt','rtf','fb2')) {
            if ($loader -notmatch ('"' + $format + '"')) { throw "Format missing: $format" }
          }

      - name: Build JAR
        shell: pwsh
        run: |
          mvn -B -f desktop/pom.xml clean package
          if (-not (Test-Path 'desktop/target/simplereader-pc-0.1.0.jar')) { throw 'Desktop jar missing' }

      - name: Build Windows portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          jpackage `
            --type app-image `
            --name SimpleReaderPC `
            --input desktop/target `
            --main-jar simplereader-pc-0.1.0.jar `
            --main-class com.simplereader.pc.SimpleReaderPc `
            --dest desktop/dist `
            --app-version 0.1.0 `
            --vendor luxiaoshi838-jpg `
            --description '简阅 PC - 本地纯净小说阅读器' `
            --verbose 2>&1 | Tee-Object -FilePath desktop/jpackage.log
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed: $LASTEXITCODE" }
          $appDir = Get-ChildItem desktop/dist -Directory | Select-Object -First 1
          if (-not $appDir) { throw 'App image missing' }
          if (-not (Test-Path (Join-Path $appDir.FullName 'SimpleReaderPC.exe'))) { throw 'EXE missing' }
          @'
          简阅 PC v0.1

          这是简阅的 Windows 本地版，不需要安装 Java。

          已实现：
          - 本地书架、分组、文件/文件夹导入、书架搜索
          - TXT / EPUB / CHM / DOCX / ODT / RTF / FB2 / HTML / MD
          - 中文 TXT UTF-8 / GB18030 / Big5 兼容
          - 章节目录、上一章/下一章
          - 按窗口宽高和当前字体实际测量分页，不使用固定字符数估算
          - 上下栏覆盖正文，显示/隐藏不改变分页区域
          - 左右键、PageUp/PageDown、空格、鼠标滚轮翻页
          - 阅读进度自动保存；窗口或字体变化后按文字锚点恢复
          - 全文搜索、书签、字体大小、纸张/护眼/夜间主题
          - CHM 使用 Windows 自带 HTML Help 解包读取，不需要额外安装组件

          使用：运行 SimpleReaderPC.exe。
          '@ | Set-Content -Path (Join-Path $appDir.FullName '使用说明.txt') -Encoding UTF8

          $zip = '简阅_PC_v0.1_Windows随用版.zip'
          Compress-Archive -Path $appDir.FullName -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File '简阅_PC_v0.1_Windows随用版_SHA256.txt' -Encoding utf8

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-PC-v0.1-Windows-portable
          path: |
            简阅_PC_v0.1_Windows随用版.zip
            简阅_PC_v0.1_Windows随用版_SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-PC-v0.1-build-log
          path: desktop/jpackage.log
          if-no-files-found: warn
          retention-days: 7
