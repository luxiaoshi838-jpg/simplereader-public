name: V748 history source audit

on:
  push:
    branches: [source-v748]
    paths: ['.github/workflows/v748-history-source-audit.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate exact historical implementations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/v748
          report=tools/v748/HISTORY_SOURCE_AUDIT.txt
          : > "$report"
          reader=app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          parser=app/src/main/java/com/simplereader/app/parser/TxtParser.kt
          cache=app/src/main/java/com/simplereader/app/reader/page/PageCacheStore.kt
          worker=app/src/main/java/com/simplereader/app/worker/ShelfCacheWorker.kt
          echo '=== AUTO-READ SOURCE COMMITS ===' >> "$report"
          for c in $(git rev-list --all -- "$reader"); do
            txt=$(git show "$c:$reader" 2>/dev/null || true)
            if grep -q 'showAutoReadDialog' <<<"$txt" && grep -q 'startAutomaticVerticalScroll' <<<"$txt" && grep -q 'scheduleAutomaticPageTurn' <<<"$txt"; then
              printf '%s\t%s\t%s\n' "$c" "$(git show -s --format=%cI "$c")" "$(git show -s --format=%s "$c")" >> "$report"
            fi
          done
          echo '=== CATALOG SOURCE COMMITS ===' >> "$report"
          for c in $(git rev-list --all -- "$parser"); do
            txt=$(git show "$c:$parser" 2>/dev/null || true)
            v=$(grep -m1 -E 'CATALOG_RULE_VERSION\s*=\s*[0-9]+' <<<"$txt" | grep -oE '[0-9]+' | tail -1 || true)
            [ -n "$v" ] || continue
            direct=0; normal=0; body=0; classif=0
            git cat-file -e "$c:app/src/main/java/com/simplereader/app/parser/DirectTxtCatalogV100.kt" 2>/dev/null && direct=1 || true
            git cat-file -e "$c:app/src/main/java/com/simplereader/app/parser/CatalogTitleNormalizerV103.kt" 2>/dev/null && normal=1 || true
            git cat-file -e "$c:app/src/main/java/com/simplereader/app/reader/ReaderBodyTitleNormalizerV104.kt" 2>/dev/null && body=1 || true
            git grep -q 'object ChapterPriorityClassifier\|class ChapterPriorityClassifier' "$c" -- app/src/main/java 2>/dev/null && classif=1 || true
            printf '%s\tv=%s\tdirect=%s\tnormalizer=%s\tbody=%s\tclassifier=%s\t%s\t%s\n' "$c" "$v" "$direct" "$normal" "$body" "$classif" "$(git show -s --format=%cI "$c")" "$(git show -s --format=%s "$c")" >> "$report"
          done
          echo '=== GEOMETRY SOURCE COMMITS ===' >> "$report"
          for c in $(git rev-list --all -- "$reader"); do
            txt=$(git show "$c:$reader" 2>/dev/null || true)
            if grep -q 'readerViewport' <<<"$txt" && grep -q 'navigationBarInsetPx' <<<"$txt" && grep -q 'setPadding' <<<"$txt"; then
              # record only versions with zero body vertical padding clues
              if grep -qE 'setPadding\([^,]+, *0, *[^,]+, *0\)|contentPaddingTopPx *= *0|contentPaddingBottomPx *= *0' <<<"$txt"; then
                printf '%s\t%s\t%s\n' "$c" "$(git show -s --format=%cI "$c")" "$(git show -s --format=%s "$c")" >> "$report"
              fi
            fi
          done
          echo '=== CACHE RULE INVALIDATION COMMITS ===' >> "$report"
          for c in $(git rev-list --all -- "$cache"); do
            txt=$(git show "$c:$cache" 2>/dev/null || true)
            if grep -q 'isRecognitionCurrent' <<<"$txt" && grep -q 'catalogRuleVersion' <<<"$txt"; then
              printf '%s\t%s\t%s\n' "$c" "$(git show -s --format=%cI "$c")" "$(git show -s --format=%s "$c")" >> "$report"
            fi
          done
          echo '=== SHELF PREFILTER SOURCE COMMITS ===' >> "$report"
          for c in $(git rev-list --all -- "$worker"); do
            txt=$(git show "$c:$worker" 2>/dev/null || true)
            if grep -q 'hasCurrentCatalog' <<<"$txt"; then
              printf '%s\t%s\t%s\n' "$c" "$(git show -s --format=%cI "$c")" "$(git show -s --format=%s "$c")" >> "$report"
            fi
          done
          echo '=== EXACT ASSET BLOBS ===' >> "$report"
          python3 - <<'PY' >> "$report"
          import subprocess, hashlib
          wanted={
          'a53aa236ac378ff97fb4c2ea1782f90ebf871717d0e04f80949b1eee2c3ff83f':'book_cover_default_txt.webp',
          '54af0ee85a3df52ff48c824db44c24643aa40060c09d9f1ae4b9e0a12f898222':'reader_material_vine_black.webp',
          'f427defab27645f4527e78be36b63dac2baffe6181792ee60facaa98a3bd924a':'reader_material_vine_blue.webp',
          '9f76af5fb50e3088305257df050ace78ca94bf532716f8adbfe05ea88f3266a1':'reader_material_vine_green.webp',
          'd10bff62231a5a8768731b4000ab3cca089963947bc1a7a1f2d7cee0713ad8d9':'reader_material_vine_white.webp',
          '14205d25ad6dd958509d3cbe038e28286ede18bfe13316fd43685cd042a5cbdb':'reader_material_vine_yellow.webp',
          '914726d53dad8205ac24b09855f30db2eec8fe15c107b5b2d7c6519e5cbc0fba':'reader_scene_duokan_black.webp',
          'd118ae7b9a46110562f646d032f6a3642d9f809513947f212d83f43adf227887':'reader_scene_duokan_blue.webp',
          '81ab407df318a3c01cc7d387d5dafee349e665ba83d8c42d15e269bb11771467':'reader_scene_duokan_green.webp',
          '30c6714f86fe4ead7161cd43d36fddcb11d4431e2d6925092d83b522586428ad':'reader_scene_duokan_white.webp',
          '474fad8c878bc9c9c31cefed608a4de578de034a9d97870d31475157be30fde8':'reader_scene_duokan_yellow.webp',
          'f792c87f60afa58c6d18d0e09ed04e4d174e5e730308e4df44c885f00fa0700f':'reader_texture_theme_blue.webp',
          'adda2b567943920c752295ad343e59bfe46bd3548a5743254d03196c33a7f6a4':'reader_texture_theme_green.webp',
          '39c05763505eab09893d85d92d535978852fd2ef3069222e9af75059c052c82a':'reader_texture_theme_white.webp',
          '3defab0dc3d4313255b37a9808e3f8e9ef95f10d382a824241c887aedbe672d9':'reader_texture_theme_yellow.webp'}
          objs=subprocess.check_output(['git','rev-list','--objects','--all']).decode().splitlines()
          found={}
          for line in objs:
              parts=line.split(' ',1)
              if len(parts)<2 or not parts[1].endswith(('.webp','.png','.jpg','.jpeg')): continue
              oid,path=parts
              try: data=subprocess.check_output(['git','cat-file','-p',oid],stderr=subprocess.DEVNULL)
              except: continue
              h=hashlib.sha256(data).hexdigest()
              if h in wanted and h not in found:
                  found[h]=(oid,path,len(data))
          for h,name in wanted.items():
              print(name, h, found.get(h,'MISSING'), sep='\t')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$report"
          git commit -m 'v748: record exhaustive historical source audit [skip ci]'
          git push origin HEAD:source-v748
