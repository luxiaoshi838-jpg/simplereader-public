name: Materialize and build v585 layered backgrounds

on:
  push:
    branches:
      - agent/v582-duokan-backgrounds

permissions:
  contents: write

concurrency:
  group: materialize-build-v585
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIMPLE_READER_VERSION_CODE: '2098000585'
      SIMPLE_READER_VERSION_NAME: '2026.07.31.layered-reading-backgrounds.585'
    steps:
      - name: Checkout v585 source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v582-duokan-backgrounds
          fetch-depth: 0

      - name: Apply independent background selection migration
        run: |
          set -euo pipefail
          python3 scripts/apply_v585_layered_backgrounds.py
          grep -Fq 'readerBackgroundTextureId' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'readerBackgroundMaterialId' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'selection.copy(colorId = colorId)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          ! grep -Fq 'readerBackgroundStyleId' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          ! grep -Fq '细麻纹' app/src/main/java/com/simplereader/app/ui/ReaderBackgrounds.kt

      - name: Download and prepare CC0 texture layers
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow numpy
          work=/tmp/v585-textures
          rm -rf "$work"
          mkdir -p "$work" app/src/main/res/drawable-nodpi

          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0 SimpleReader build' \
            'https://ambientcg.com/get?file=Paper001_1K-JPG.zip' -o "$work/Paper001.zip"
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0 SimpleReader build' \
            'https://ambientcg.com/get?file=Paper006_1K-JPG.zip' -o "$work/Paper006.zip"
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0 SimpleReader build' \
            'https://ambientcg.com/get?file=SurfaceImperfections011_1K-JPG.zip' -o "$work/SurfaceImperfections011.zip"

          mkdir -p "$work/Paper001" "$work/Paper006" "$work/SurfaceImperfections011"
          unzip -q "$work/Paper001.zip" -d "$work/Paper001"
          unzip -q "$work/Paper006.zip" -d "$work/Paper006"
          unzip -q "$work/SurfaceImperfections011.zip" -d "$work/SurfaceImperfections011"

          python3 - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageFilter

          work = Path('/tmp/v585-textures')
          out = Path('app/src/main/res/drawable-nodpi')
          out.mkdir(parents=True, exist_ok=True)

          def choose(root: Path, tokens):
              files = [p for p in root.rglob('*') if p.suffix.lower() in {'.jpg', '.jpeg', '.png'}]
              for token in tokens:
                  matches = [p for p in files if token.lower() in p.name.lower()]
                  if matches:
                      return sorted(matches, key=lambda p: (len(p.name), p.name))[0]
              raise RuntimeError(f'No usable texture map in {root}; found {[p.name for p in files]}')

          def load_square(path: Path, size=512):
              image = Image.open(path).convert('L')
              side = min(image.size)
              left = (image.width - side) // 2
              top = (image.height - side) // 2
              image = image.crop((left, top, left + side, top + side))
              return image.resize((size, size), Image.Resampling.LANCZOS)

          def wrap_blur(image: Image.Image, radius: float):
              w, h = image.size
              tiled = Image.new('L', (w * 3, h * 3))
              for y in range(3):
                  for x in range(3):
                      tiled.paste(image, (x * w, y * h))
              blurred = tiled.filter(ImageFilter.GaussianBlur(radius))
              return blurred.crop((w, h, 2 * w, 2 * h))

          def normalized(values, target_std):
              values = values.astype(np.float32)
              values -= float(values.mean())
              std = float(values.std())
              if std < 0.5:
                  raise RuntimeError(f'Texture source has insufficient variation: std={std}')
              values = 128.0 + values * (target_std / std)
              return np.clip(values, 0, 255).astype(np.uint8)

          def save_layer(values, name):
              image = Image.fromarray(values, mode='L').convert('RGB')
              image.save(out / name, format='PNG', optimize=True)
              check = np.asarray(image.convert('L'), dtype=np.float32)
              if check.std() < 10:
                  raise RuntimeError(f'Generated layer {name} is visually too flat')
              print(name, 'std=', round(float(check.std()), 2), 'bytes=', (out / name).stat().st_size)

          paper1 = load_square(choose(work / 'Paper001', ['Roughness', 'Color', 'Displacement']))
          paper1_low = wrap_blur(paper1, 10)
          grain = np.asarray(paper1, dtype=np.float32) - np.asarray(paper1_low, dtype=np.float32)
          save_layer(normalized(grain, 30), 'reader_texture_paper_grain.png')

          paper6 = load_square(choose(work / 'Paper006', ['Color', 'Roughness', 'Displacement']))
          paper6_low = wrap_blur(paper6, 22)
          paper6_mid = wrap_blur(paper6, 2)
          fiber = (
              0.78 * (np.asarray(paper6, dtype=np.float32) - np.asarray(paper6_low, dtype=np.float32)) +
              0.38 * (np.asarray(paper6, dtype=np.float32) - np.asarray(paper6_mid, dtype=np.float32))
          )
          save_layer(normalized(fiber, 36), 'reader_texture_paper_fiber.png')

          surface = load_square(choose(work / 'SurfaceImperfections011', ['Roughness', 'Color', 'Displacement']))
          frosted = np.asarray(wrap_blur(surface, 28), dtype=np.float32)
          save_layer(normalized(frosted, 24), 'reader_material_frosted.png')

          patina_source = load_square(choose(work / 'SurfaceImperfections011', ['Color', 'Roughness', 'Displacement']))
          patina = np.asarray(wrap_blur(patina_source, 5), dtype=np.float32)
          save_layer(normalized(patina, 42), 'reader_material_patina.png')
          PY

          cat > THIRD_PARTY_TEXTURES.md <<'EOF'
          # Third-party reading background textures

          SimpleReader v585 uses resized and grayscale-derived texture maps from ambientCG:

          - Paper 001: https://ambientcg.com/view?id=Paper001
          - Paper 006: https://ambientcg.com/view?id=Paper006
          - Surface Imperfections 011: https://ambientcg.com/view?id=SurfaceImperfections011

          ambientCG releases these downloadable asset files under the Creative Commons CC0 1.0 Universal public-domain dedication. The app stores optimized 512×512 derivatives for reading-background texture and material layers. No third-party application code or proprietary reading-app artwork is included.
          EOF

          test -s app/src/main/res/drawable-nodpi/reader_texture_paper_grain.png
          test -s app/src/main/res/drawable-nodpi/reader_texture_paper_fiber.png
          test -s app/src/main/res/drawable-nodpi/reader_material_frosted.png
          test -s app/src/main/res/drawable-nodpi/reader_material_patina.png

      - name: Commit materialized source and CC0 assets
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
                  app/src/test/java/com/simplereader/app/ui/LayeredReaderBackgroundContractTest.kt \
                  app/src/main/res/drawable-nodpi/reader_texture_paper_grain.png \
                  app/src/main/res/drawable-nodpi/reader_texture_paper_fiber.png \
                  app/src/main/res/drawable-nodpi/reader_material_frosted.png \
                  app/src/main/res/drawable-nodpi/reader_material_patina.png \
                  THIRD_PARTY_TEXTURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize independent color texture and material backgrounds'
            git push origin HEAD:agent/v582-duokan-backgrounds
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble v585
        run: |
          set -euo pipefail
          timeout --signal=INT 6m ./gradlew testReleaseUnitTest --stacktrace --console=plain | tee /tmp/v585-tests.log
          timeout --signal=INT 6m ./gradlew assembleRelease --stacktrace --console=plain | tee /tmp/v585-build.log

      - name: Verify v585 package and embedded layers
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" /tmp/SimpleReader-v585-unsigned.apk
          "$build_tools/aapt2" dump badging /tmp/SimpleReader-v585-unsigned.apk | tee /tmp/v585-badging.log
          grep -Fq "package: name='com.simplereader.app'" /tmp/v585-badging.log
          grep -Fq "versionCode='2098000585'" /tmp/v585-badging.log
          unzip -l /tmp/SimpleReader-v585-unsigned.apk | tee /tmp/v585-zip-list.log
          grep -Fq 'reader_texture_paper_grain' /tmp/v585-zip-list.log
          grep -Fq 'reader_texture_paper_fiber' /tmp/v585-zip-list.log
          grep -Fq 'reader_material_frosted' /tmp/v585-zip-list.log
          grep -Fq 'reader_material_patina' /tmp/v585-zip-list.log
          unzip -p /tmp/SimpleReader-v585-unsigned.apk classes.dex | strings | grep -Fq 'background_texture_v585'
          unzip -p /tmp/SimpleReader-v585-unsigned.apk classes.dex | strings | grep -Fq 'background_material_v585'
          sha256sum /tmp/SimpleReader-v585-unsigned.apk | tee /tmp/v585-unsigned.sha256

      - name: Upload unsigned v585 and logs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v585-unsigned-${{ github.run_number }}
          path: |
            /tmp/SimpleReader-v585-unsigned.apk
            /tmp/v585-tests.log
            /tmp/v585-build.log
            /tmp/v585-badging.log
            /tmp/v585-zip-list.log
            /tmp/v585-unsigned.sha256
          if-no-files-found: error
          retention-days: 3
