name: Clean final v615 branch

on:
  push:
    branches:
      - agent/v615-reader-stability
    paths:
      - .github/workflows/cleanup-v615-branch.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v615-reader-stability
          fetch-depth: 0
      - name: Remove temporary files and restore permanent validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/android-pr-validation.yml
          rm -rf .automation
          rm -f \
            .github/workflows/cleanup-v615-branch.yml \
            .github/workflows/apply-v615-reader-fix.yml \
            .github/workflows/apply-v615-through-pr.yml \
            .github/workflows/export-agent-source.yml \
            .github/workflows/export-offline-toolchain.yml \
            .github/workflows/build-final-v615.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'v615: remove temporary build files and restore CI'
          git push origin HEAD:agent/v615-reader-stability
