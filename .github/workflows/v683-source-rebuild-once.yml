name: V683 source rebuild one-shot

on:
  push:
    branches:
      - source-rebuild-v683

permissions:
  contents: write

jobs:
  source-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: source-rebuild-v683
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply source migration
        run: python3 tools/source-rebuild-v683/apply_source_migration.py

      - name: Verify source-only production path
        run: tools/verify-source-only-production.sh

      - name: Test and build from source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit migrated source
        run: |
          rm -f .github/workflows/v683-source-rebuild-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tools .github/workflows/v683-source-rebuild-once.yml || true
          git commit -m "Sourceize current behavior from V683 lineage [source-rebuild-applied]"
          git push origin HEAD:source-rebuild-v683
