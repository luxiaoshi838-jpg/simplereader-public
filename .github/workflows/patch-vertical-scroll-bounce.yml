name: Patch vertical scroll bounce

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-vertical-scroll-bounce.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_vertical_scroll_bounce.py
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          reader=app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'continuousScrollGeneration += 1L' "$reader"
          grep -Fq 'generationAtSchedule != continuousScrollGeneration' "$reader"
          grep -Fq 'renderContinuousWindow(anchorOffset, anchorViewportOffsetPx)' "$reader"
          grep -Fq 'absoluteLineTop - anchorViewportOffsetPx' "$reader"
          ! grep -Fq 'renderContinuousWindow(anchorOffset)' "$reader"
      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-vertical-scroll-bounce.yml tools/patch_vertical_scroll_bounce.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix vertical continuous-scroll window bounce'
          git push origin HEAD:main
