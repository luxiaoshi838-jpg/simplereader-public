name: Validate and build 简阅 v791 vertical rollback v3

on:
  push:
    branches:
      - source-v791
    paths:
      - tools/apply-v791-vertical-scroll-rollback-final.py
      - .github/workflows/build-v791-vertical-rollback-v3.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  SIMPLE_READER_VERSION_CODE: "2098000791"
  SIMPLE_READER_VERSION_NAME: "791"

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source-v791
        uses: actions/checkout@v4
        with:
          ref: source-v791
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply final deterministic v791 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-v791-vertical-scroll-rollback-final.py
          git diff --check
          grep -Fq 'snackbar.setAction("↩︎ 回撤")' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'snackbar.setAnchorView(readerControls)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'private const val VERTICAL_ROLLBACK_VISIBLE_MS = 3_000L' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'private const val VERTICAL_SETTLING_GUARD_MS = 5_000L' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt').read_text()
          a = s.index('MotionEvent.ACTION_DOWN -> {', s.index('internal fun verticalHandleTouch'))
          b = s.index('MotionEvent.ACTION_UP', a)
          block = s[a:b]
          assert block.index('rv?.stopScroll()') < block.index('verticalGestureStartLocation = captureVerticalLocation()')
          print('PASS: touch brake occurs before v791 gesture-origin capture')
          PY

      - name: Warm or refresh runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew :app:checkDebugAarMetadata --offline --stacktrace --console=plain; then
            echo 'Dependency graph available from restored Gradle cache.'
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Online dependency resolution attempt ${attempt}/3"
            if ./gradlew :app:checkDebugAarMetadata --refresh-dependencies --stacktrace --console=plain; then
              exit 0
            fi
          done
          echo 'Dependency resolution failed after cache attempt and three online attempts.' >&2
          exit 1

      - name: Run v791 targeted tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests 'com.simplereader.app.ui.ReaderV791VerticalRollbackContractTest' \
            --tests 'com.simplereader.app.ui.ReaderCacheAndRestoreContractTest' \
            --tests 'com.simplereader.app.ui.ReaderCatalogAndProgressUiContractTest' \
            --stacktrace --console=plain
          ./gradlew testReleaseUnitTest \
            --tests 'com.simplereader.app.ui.ReaderV791VerticalRollbackContractTest' \
            --tests 'com.simplereader.app.ui.ReaderCacheAndRestoreContractTest' \
            --tests 'com.simplereader.app.ui.ReaderCatalogAndProgressUiContractTest' \
            --stacktrace --console=plain

      - name: Check full suite against inherited baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/v759-full-unit-baseline-gate.sh
          bash tools/v759-full-unit-baseline-gate.sh v791-full-unit-tests.log

      - name: Build Debug and Release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --console=plain 2>&1 | tee v791-build.log

      - name: Verify v791 package
        shell: bash
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -s "$unsigned" ] || unsigned="app/build/outputs/apk/release/app-release.apk"
          test -s "$unsigned"
          mkdir -p release
          cp "$unsigned" release/SimpleReader_v791_unsigned.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${build_tools}/aapt2" dump badging "$unsigned" | tee v791-package.txt
          grep -Fq "package: name='com.simplereader.app'" v791-package.txt
          grep -Fq "versionCode='2098000791'" v791-package.txt
          grep -Fq "versionName='791'" v791-package.txt
          sha256sum "$unsigned" | tee v791-unsigned-sha256.txt

      - name: Commit only after validation passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore tools/apply-v791-vertical-scroll-rollback.py
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
            app/src/main/java/com/simplereader/app/ui/VerticalPageAdapter.kt \
            app/src/test/java/com/simplereader/app/ui/ReaderV791VerticalRollbackContractTest.kt \
            TXT_READER_RENDERING_MAINTENANCE_LOG.md \
            maintenance/V791_VERTICAL_FLING_ROLLBACK.md
          git diff --cached --exit-code && { echo 'Expected v791 diff is empty'; exit 1; } || true
          git commit -m "v791: brake vertical fling and add jump rollback"
          git push origin HEAD:source-v791

      - name: Upload validated unsigned v791
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v791-validated-unsigned-v3
          path: |
            release/SimpleReader_v791_unsigned.apk
            v791-package.txt
            v791-unsigned-sha256.txt
            v791-build.log
            v791-full-unit-tests.log
          if-no-files-found: error
          retention-days: 7
