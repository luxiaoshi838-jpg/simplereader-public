name: Sign 简阅 v755

on:
  push:
    branches:
      - source-v755
  workflow_dispatch:

permissions:
  contents: read

env:
  SIMPLE_READER_VERSION_CODE: "2098000755"
  SIMPLE_READER_VERSION_NAME: "755"
  EXPECTED_SIGNING_SHA256: "315d7bbf06b2a0a16ea7efd7a5c7cd8e6371ab9b0f40ae380cc416e1472c8648"
  SIGNING_ALIAS: "simplereader-public-v1"

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore and verify protected signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIMPLEREADER_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIMPLEREADER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_PASSWORD"
          key="$RUNNER_TEMP/simplereader-public-v1.keystore"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$key"
          test -s "$key"
          actual="$(keytool -list -v -keystore "$key" -storepass "$SIGNING_PASSWORD" -alias "$SIGNING_ALIAS" 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':\r\n ' | tr 'A-F' 'a-f')"
          test "$actual" = "$EXPECTED_SIGNING_SHA256"
          echo "SIGNING_KEYSTORE=$key" >> "$GITHUB_ENV"
      - name: Run v755 gates and build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew tools/v755-42-gates.sh
          bash tools/v755-42-gates.sh
          ./gradlew testDebugUnitTest --tests com.simplereader.app.parser.TxtCatalogRule112Test assembleRelease --stacktrace 2>&1 | tee gradle-build.log
      - name: Sign and verify v755
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIMPLEREADER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          out="app/build/outputs/apk/release/SimpleReader_v755_signed.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${build_tools}/apksigner" sign \
            --ks "$SIGNING_KEYSTORE" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$out" "$unsigned"
          "${build_tools}/apksigner" verify --verbose --print-certs "$out" | tee apk-certificate.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-certificate.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' apk-certificate.txt
          actual="$(sed -n 's/.*certificate SHA-256 digest: //p' apk-certificate.txt | head -n1 | tr -d ':\r\n ' | tr 'A-F' 'a-f')"
          test "$actual" = "$EXPECTED_SIGNING_SHA256"
          "${build_tools}/aapt2" dump badging "$out" | tee apk-package-info.txt
          grep -Fq "package: name='com.simplereader.app'" apk-package-info.txt
          grep -Fq "versionCode='2098000755'" apk-package-info.txt
          grep -Fq "versionName='755'" apk-package-info.txt
          sha256sum "$out" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v755-signed-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/SimpleReader_v755_signed.apk
            apk-certificate.txt
            apk-package-info.txt
            apk-sha256.txt
            gradle-build.log
          if-no-files-found: error
          retention-days: 7
