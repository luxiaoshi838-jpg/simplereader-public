name: Apply reader chrome overlay

on:
  push:
    branches: [agent/remove-reader-chrome-compression]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-reader-chrome-compression
          fetch-depth: 0
      - name: Apply overlay-only reader chrome migration
        run: python tools/apply-reader-chrome-overlay.py
      - name: Verify overlay-only reader chrome
        run: bash tools/verify-reader-chrome-overlay.sh
      - name: Commit patched source to repair branch
        run: |
          git config user.name "simple-reader-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt app/src/main/res/layout/activity_reader.xml app/src/main/res/values/styles.xml app/src/main/AndroidManifest.xml UI_BASELINE.md tools/verify-reader-chrome-overlay.sh
          git commit -m "[skip ci] Remove reader chrome layout compression"
          git push origin HEAD:agent/remove-reader-chrome-compression
