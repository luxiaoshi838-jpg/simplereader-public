name: Cleanup reader chrome geometry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-reader-chrome-geometry.yml
      - tools/cleanup-reader-chrome-geometry.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 tools/cleanup-reader-chrome-geometry.py
      - name: Verify cleanup
        run: |
          grep -q 'supportRequestWindowFeature(Window.FEATURE_ACTION_BAR_OVERLAY)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -q 'readerControls.visibility = if (visible) View.VISIBLE else View.INVISIBLE' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          ! grep -A14 'private fun bindReaderInsets' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt | grep -q 'paginateAndDisplay'
          grep -A14 'private fun bindReaderInsets' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt | grep -q 'if (!readerInsetsApplied)'
          grep -A20 '@+id/readerControls' app/src/main/res/layout/activity_reader.xml | grep -q 'android:visibility="invisible"'
      - name: Commit cleanup and remove one-shot files
        run: |
          rm -f .github/workflows/cleanup-reader-chrome-geometry.yml tools/cleanup-reader-chrome-geometry.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Remove reader chrome geometry compression paths'
          git push origin HEAD:main
