name: Export source for v608 work

on:
  push:
    branches:
      - work/page-engine-v608
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -qr simplereader-public-source.zip . -x '.git/*' -x 'app/build/*' -x '.gradle/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: simplereader-public-source
          path: simplereader-public-source.zip
          if-no-files-found: error
          retention-days: 3
