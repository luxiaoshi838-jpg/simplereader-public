name: V747 source build

on:
  push:
    branches: [source-v747]
    paths: ['.github/workflows/v747-source-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v747 source-only reader restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v747/apply_v747.py
          bash tools/verify-ui-policy.sh
          bash tools/verify-source-only-production.sh
          ! grep -R -n -E 'classes[0-9]*\.dex|dex offset|register patch' app/src/main
          echo V747_SOURCE_GUARD=PASS

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK builds
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease --stacktrace

      - name: APK static parse gates
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          RELEASE=app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t "$DEBUG" > debug-zip-test.txt
          unzip -t "$RELEASE" > release-zip-test.txt
          "$BT/zipalign" -c -v 4 "$DEBUG" > debug-zipalign.txt
          "$BT/zipalign" -c -v 4 "$RELEASE" > release-zipalign.txt
          "$BT/aapt2" dump badging "$DEBUG" > debug-badging.txt
          "$BT/aapt2" dump badging "$RELEASE" > release-badging.txt
          grep -F "package: name='com.simplereader.app'" release-badging.txt
          grep -F "versionCode='2098000747'" release-badging.txt
          grep -F "versionName='747'" release-badging.txt
          if ! grep -Eq "sdkVersion:'?26'?|minSdkVersion[^0-9]*26" release-badging.txt; then
            grep -Fq 'minSdk = 26' app/build.gradle.kts
          fi
          echo V747_MINSDK_26=PASS
          cp "$BT/lib/apksigner.jar" apksigner.jar
          sha256sum "$RELEASE" > GITHUB_BUILD_SHA256.txt

      - name: Commit final v747 normal source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt app/src/main/res/layout/activity_reader.xml app/src/main/res/drawable/bg_auto_read_stop.xml app/src/test/java/com/simplereader/app/ui/V747AutoReadContractTest.kt tools/verify-source-only-production.sh
          git commit -m 'v747: restore source-native automatic reading [skip ci]'
          git push origin HEAD:source-v747

      - name: Upload GitHub source-built v747
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v747-source-build
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            apksigner.jar
            GITHUB_BUILD_SHA256.txt
            release-badging.txt
            release-zip-test.txt
            release-zipalign.txt

  emulator_gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SimpleReader-v747-source-build
          path: artifact

      - name: Android 35 real install and cold launch gate
        timeout-minutes: 5
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r artifact/app-debug.apk
            adb shell am force-stop com.simplereader.app
            adb shell monkey -p com.simplereader.app -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell dumpsys activity activities | grep -q 'com.simplereader.app/.ui.MainActivity'
            if adb logcat -d -t 400 | grep -E 'FATAL EXCEPTION|AndroidRuntime.*com.simplereader.app'; then exit 1; fi
            echo V747_ANDROID35_INSTALL_COLD_LAUNCH=PASS
