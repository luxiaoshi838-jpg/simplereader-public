name: Export v617 source

on:
  push:
    branches:
      - agent/v617-cover-background-cache

permissions:
  contents: write

jobs:
  export:
    if: github.event.head_commit.message != 'Record v617 source run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          printf '%s\n' "$GITHUB_RUN_ID" > .automation/v617-source-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .automation/v617-source-run.txt
          git commit -m 'Record v617 source run'
          git push
      - name: Pack source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.gradle --exclude='**/build' -czf /tmp/simplereader-v617-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: simplereader-v617-source
          path: /tmp/simplereader-v617-source.tar.gz
          if-no-files-found: error
          retention-days: 1
