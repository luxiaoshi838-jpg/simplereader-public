name: Export agent source

on:
  push:
    branches:
      - agent/v615-reader-stability
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          rm -rf .git
          zip -r simplereader-public-source.zip . -x 'simplereader-public-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: simplereader-public-source
          path: simplereader-public-source.zip
          if-no-files-found: error
          retention-days: 1
