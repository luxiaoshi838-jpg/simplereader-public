name: Export Android offline toolchain

on:
  push:
    branches:
      - agent/v615-reader-stability
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-offline-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    if: github.event.head_commit.message != 'Record offline toolchain run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record run id before long steps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          printf '%s\n' "$GITHUB_RUN_ID" > .automation/offline-toolchain-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .automation/offline-toolchain-run.txt
          git commit -m 'Record offline toolchain run'
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Populate Gradle dependencies
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          timeout --signal=INT 5m ./gradlew assembleRelease --stacktrace --console=plain > /tmp/offline-build.log 2>&1
          code=$?
          tail -n 200 /tmp/offline-build.log
          exit $code
      - name: Pack offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p /tmp/offline/android-sdk/build-tools /tmp/offline/android-sdk/platforms /tmp/offline/android-sdk/platform-tools /tmp/offline/android-sdk/licenses
          cp -a "$build_tools" /tmp/offline/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/offline/android-sdk/platforms/
          cp -a "$ANDROID_HOME/platform-tools/." /tmp/offline/android-sdk/platform-tools/
          cp -a "$ANDROID_HOME/licenses/." /tmp/offline/android-sdk/licenses/
          cp -a "$JAVA_HOME" /tmp/offline/jdk17
          cp -a "$HOME/.gradle" /tmp/offline/gradle-home
          rm -rf /tmp/offline/gradle-home/daemon /tmp/offline/gradle-home/workers /tmp/offline/gradle-home/notifications
          tar -C /tmp/offline -czf /tmp/simplereader-offline-toolchain.tar.gz .
          sha256sum /tmp/simplereader-offline-toolchain.tar.gz > /tmp/simplereader-offline-toolchain.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: simplereader-offline-toolchain
          path: |
            /tmp/simplereader-offline-toolchain.tar.gz
            /tmp/simplereader-offline-toolchain.tar.gz.sha256
            /tmp/offline-build.log
          if-no-files-found: error
          retention-days: 1
