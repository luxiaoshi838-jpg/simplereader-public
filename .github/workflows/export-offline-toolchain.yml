name: Export Android build fix

on:
  push:
    branches:
      - agent/v615-reader-stability
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-android-build-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    if: github.event.head_commit.message != 'Record Android build fix run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          printf '%s\n' "$GITHUB_RUN_ID" > .automation/android-build-fix-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .automation/android-build-fix-run.txt
          git commit -m 'Record Android build fix run'
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pack real JDK 17 and Build Tools 33.0.1
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/build-tools/33.0.1"
          mkdir -p /tmp/build-fix/android-sdk/build-tools
          cp -a "$ANDROID_HOME/build-tools/33.0.1" /tmp/build-fix/android-sdk/build-tools/
          cp -aL "$JAVA_HOME" /tmp/build-fix/jdk17
          tar -C /tmp/build-fix -czf /tmp/simplereader-android-build-fix.tar.gz .
          sha256sum /tmp/simplereader-android-build-fix.tar.gz > /tmp/simplereader-android-build-fix.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: simplereader-android-build-fix
          path: |
            /tmp/simplereader-android-build-fix.tar.gz
            /tmp/simplereader-android-build-fix.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
