name: Build v608 release artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SIMPLE_READER_VERSION_CODE: "2026080208"
      SIMPLE_READER_VERSION_NAME: "608"
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Assemble v608 release
        run: timeout --signal=INT 5m ./gradlew clean assembleRelease --stacktrace --console=plain
      - name: Upload v608 release
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v608-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 2
