name: v748 JDK17 Export
on:
  push:
    branches: [source-v748]
    paths: ['.github/workflows/v748-offline-parts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-jdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pack real JDK 17 directory
        shell: bash
        run: |
          set -euxo pipefail
          real_java_home="$(readlink -f "$JAVA_HOME")"
          test -x "$real_java_home/bin/java"
          "$real_java_home/bin/java" -version
          mkdir -p /tmp/v748parts
          parent="$(dirname "$real_java_home")"
          base="$(basename "$real_java_home")"
          tar -C "$parent" -czf /tmp/v748parts/jdk17-real.tar.gz "$base"
          tar -tzf /tmp/v748parts/jdk17-real.tar.gz > /tmp/v748parts/jdk17-list.txt
          grep -Fq "$base/bin/java" /tmp/v748parts/jdk17-list.txt
          du -h /tmp/v748parts/jdk17-real.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: v748-jdk17-real-fixed
          path: /tmp/v748parts/jdk17-real.tar.gz
          compression-level: 0
          retention-days: 1
