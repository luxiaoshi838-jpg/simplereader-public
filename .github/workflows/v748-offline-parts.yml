name: v748 Offline Parts Export
on:
  push:
    branches: [source-v748]
    paths: ['.github/workflows/v748-offline-parts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Populate required Gradle modules
        shell: bash
        run: |
          set -eux
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath >/tmp/dependencies.txt
          ./gradlew :app:assembleDebug -x test --stacktrace --console=plain >/tmp/assemble-debug.log 2>&1 || true
          du -sh ~/.gradle/wrapper ~/.gradle/caches/modules-2 ~/.gradle/caches/8.2.1 "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0" "$JAVA_HOME" | tee /tmp/sizes.txt
      - name: Pack independent parts
        shell: bash
        run: |
          set -eux
          mkdir -p /tmp/v748parts
          tar -C "$HOME" -czf /tmp/v748parts/gradle-wrapper.tar.gz .gradle/wrapper
          tar -C "$HOME" -czf /tmp/v748parts/gradle-modules.tar.gz .gradle/caches/modules-2
          tar -C "$ANDROID_HOME" -czf /tmp/v748parts/android-sdk-35.tar.gz platforms/android-35 build-tools/35.0.0 platform-tools
          tar -chzf /tmp/v748parts/jdk17.tar.gz "$JAVA_HOME"
          cp /tmp/sizes.txt /tmp/v748parts/sizes.txt
          ls -lh /tmp/v748parts | tee /tmp/v748parts/files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v748-gradle-wrapper
          path: /tmp/v748parts/gradle-wrapper.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: v748-gradle-modules
          path: /tmp/v748parts/gradle-modules.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: v748-android-sdk-35
          path: /tmp/v748parts/android-sdk-35.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: v748-jdk17-real
          path: /tmp/v748parts/jdk17.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: v748-offline-sizes
          path: |
            /tmp/v748parts/sizes.txt
            /tmp/v748parts/files.txt
          retention-days: 1