name: Build 简阅 v769

on:
  push:
    branches:
      - source-v769
  workflow_dispatch:

permissions:
  contents: write

env:
  SIMPLE_READER_VERSION_CODE: "2098000769"
  SIMPLE_READER_VERSION_NAME: "769"
  APK_PATH: "app/build/outputs/apk/release/SimpleReader_v769_github_unsigned.apk"
  MAX_APK_BYTES: "52428800"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v769
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply v769 selection/touch coexistence patch
        shell: bash
        run: |
          if grep -Fq '2098000769' app/build.gradle.kts \
            && grep -Fq 'private fun handleReaderTouchEvent(event: MotionEvent)' app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt \
            && grep -Fq 'ReaderTouchObservingRecyclerView(this)' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
            && grep -Fq 'ReaderTouchObservingNestedScrollView' app/src/main/res/layout/activity_reader.xml; then
            echo 'v769 source patch already persisted; verifying exact persisted source.'
          else
            python3 tools/apply-v769-selection-touch-routing.py
          fi
      - run: chmod +x ./gradlew tools/v769-52-gates.sh tools/v769-selection-touch-gates.sh tools/v767-settings-layout-gates.sh tools/v769-full-unit-baseline-gate.sh
      - name: Run v769 inherited 52 stability gates
        run: bash tools/v769-52-gates.sh
      - name: Run v769 selection/touch coexistence gates
        run: bash tools/v769-selection-touch-gates.sh
      - name: Run compact settings-row layout gate
        run: bash tools/v767-settings-layout-gates.sh
      - name: Verify source diff formatting
        run: git diff --check
      - name: Persist verified v769 source changes
        shell: bash
        run: |
          if git diff --quiet -- \
            app/build.gradle.kts \
            app/src/main/res/layout/activity_reader.xml \
            app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
            app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt \
            app/src/main/java/com/simplereader/app/ui/ReaderTouchObservingViews.kt; then
            echo 'v769 source already persisted.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/build.gradle.kts \
            app/src/main/res/layout/activity_reader.xml \
            app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
            app/src/main/java/com/simplereader/app/ui/PagedReaderView.kt \
            app/src/main/java/com/simplereader/app/ui/ReaderTouchObservingViews.kt
          git commit -m 'v769：选中文本开启时保留阅读页触摸与中心栏切换 [skip ci]'
          git push origin HEAD:source-v769
      - name: Run full unit suite against unchanged V758 failure baseline
        shell: bash
        run: bash tools/v769-full-unit-baseline-gate.sh v769-full-unit-tests.log
      - name: Build v769 release
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-build.log
      - name: Verify v769 APK and export official signer
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -f "$src" ] || src="app/build/outputs/apk/release/app-release.apk"
          cp "$src" "$APK_PATH"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${build_tools}/aapt2" dump badging "$APK_PATH" | tee apk-package-info.txt
          grep -Fq "package: name='com.simplereader.app'" apk-package-info.txt
          grep -Fq "versionCode='2098000769'" apk-package-info.txt
          grep -Fq "versionName='769'" apk-package-info.txt
          grep -Fq "minSdkVersion:'26'" apk-package-info.txt
          test "$(stat -c %s "$APK_PATH")" -le "$MAX_APK_BYTES"
          sha256sum "$APK_PATH" | tee apk-sha256.txt
          mkdir -p signing-tools/lib
          cp "${build_tools}/apksigner" signing-tools/apksigner
          cp "${build_tools}/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v769-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            apk-sha256.txt
            apk-package-info.txt
            v769-full-unit-tests.log
            gradle-build.log
            signing-tools/apksigner
            signing-tools/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 7
