name: Build 简阅 v753

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SIMPLE_READER_VERSION_CODE: "2098000753"
  SIMPLE_READER_VERSION_NAME: "753"
  APK_NAME: "SimpleReader_v753_github_unsigned.apk"
  APK_PATH: "app/build/outputs/apk/release/SimpleReader_v753_github_unsigned.apk"
  APK_SIZE_WARNING_BYTES: "16777216"
  MAX_APK_BYTES: "52428800"

concurrency:
  group: simplereader-v753-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and verify v753 unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reject tracked APK files
        shell: bash
        run: bash tools/verify-no-apk.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT 5m ./gradlew clean assembleRelease --stacktrace 2>&1 | tee gradle-build.log

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$unsigned_apk" ]; then
            cp "$unsigned_apk" "$APK_PATH"
          else
            cp "$signed_apk" "$APK_PATH"
          fi
          test -s "$APK_PATH"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${build_tools}/zipalign" -c -v 4 "$APK_PATH" | tee zipalign-check.txt
          "${build_tools}/aapt2" dump badging "$APK_PATH" | tee apk-package-info.txt
          grep -Fq "package: name='com.simplereader.app'" apk-package-info.txt
          grep -Fq "versionCode='2098000753'" apk-package-info.txt
          grep -Fq "versionName='753'" apk-package-info.txt
          grep -Fq "sdkVersion:'26'" apk-package-info.txt
          apk_bytes="$(stat -c %s "$APK_PATH")"
          test "$apk_bytes" -le "$MAX_APK_BYTES"
          sha256sum "$APK_PATH" | tee apk-sha256.txt
          echo 'Validation complete. Unsigned APK is uploaded as an Actions artifact only and is not committed to the public repository.'

      - name: Upload v753 unsigned APK and verification logs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v753-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            apk-sha256.txt
            apk-package-info.txt
            zipalign-check.txt
            gradle-build.log
          if-no-files-found: error
          retention-days: 7
