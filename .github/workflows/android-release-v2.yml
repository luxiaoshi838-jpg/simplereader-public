name: Build 简阅 v778

on:
  push:
    branches:
      - source-v778
  workflow_dispatch:

permissions:
  contents: write

env:
  SIMPLE_READER_VERSION_CODE: "2098000778"
  SIMPLE_READER_VERSION_NAME: "778"
  APK_PATH: "app/build/outputs/apk/release/SimpleReader_v778_github_unsigned.apk"
  MAX_APK_BYTES: "52428800"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v778
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Preserve v773 startup-safe shelf fast-scroll fix
        shell: bash
        run: python3 tools/apply-v773-startup-safe-fastscroll.py

      - name: Preserve v775 single-image-slot day/night structure
        shell: bash
        run: python3 tools/apply-v775-single-mode-icon.py

      - name: Preserve v776 shelf-only outline daytime sun
        shell: bash
        run: python3 tools/apply-v776-shelf-outline-day.py

      - name: Preserve v777 shelf/group fast-scroll gutter
        shell: bash
        run: python3 tools/apply-v777-fastscroll-gutter.py

      - name: Apply v778 centered fast-scroll track
        shell: bash
        run: python3 tools/apply-v778-center-fastscroll-track.py

      - name: Persist v778 runtime source before validation
        shell: bash
        run: |
          if git diff --quiet -- \
            app/build.gradle.kts \
            app/src/main/java/com/simplereader/app/ui/ShelfFastScroller.kt; then
            echo 'v778 runtime source already persisted.'
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              app/build.gradle.kts \
              app/src/main/java/com/simplereader/app/ui/ShelfFastScroller.kt
            git commit -m 'v778：持久化滑块轨道与滑块同中心线 [skip ci]'
            git push origin HEAD:source-v778
          fi

      - run: chmod +x ./gradlew tools/v770-52-gates.sh tools/v770-selection-touch-gates.sh tools/v770-instant-selection-gates.sh tools/v767-settings-layout-gates.sh tools/v770-full-unit-baseline-gate.sh tools/v773-startup-fastscroll-gates.sh tools/v777-fastscroll-gutter-gates.sh tools/v778-fastscroll-track-center-gates.sh tools/v778-emulator-launch-test.sh

      - name: Run inherited 52 stability gates
        run: bash tools/v770-52-gates.sh
      - name: Run inherited selection/touch coexistence gates
        run: bash tools/v770-selection-touch-gates.sh
      - name: Run inherited instant selection activation gates
        run: bash tools/v770-instant-selection-gates.sh
      - name: Run compact settings-row layout gate
        run: bash tools/v767-settings-layout-gates.sh
      - name: Run v778 fast-scroll track-center gates
        run: bash tools/v778-fastscroll-track-center-gates.sh

      - name: Verify source diff formatting
        run: git diff --check

      - name: Run full unit suite against unchanged V758 failure baseline
        shell: bash
        run: bash tools/v770-full-unit-baseline-gate.sh v778-full-unit-tests.log

      - name: Build v778 release
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-build.log

      - name: Enable KVM group access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 35 real Release cold-launch gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/v778-emulator-launch-test.sh

      - name: Verify v778 APK and export official signer
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -f "$src" ] || src="app/build/outputs/apk/release/app-release.apk"
          cp "$src" "$APK_PATH"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${build_tools}/aapt2" dump badging "$APK_PATH" | tee apk-package-info.txt
          grep -Fq "package: name='com.simplereader.app'" apk-package-info.txt
          grep -Fq "versionCode='2098000778'" apk-package-info.txt
          grep -Fq "versionName='778'" apk-package-info.txt
          grep -Fq "minSdkVersion:'26'" apk-package-info.txt
          test "$(stat -c %s "$APK_PATH")" -le "$MAX_APK_BYTES"
          sha256sum "$APK_PATH" | tee apk-sha256.txt
          mkdir -p signing-tools/lib
          cp "${build_tools}/apksigner" signing-tools/apksigner
          cp "${build_tools}/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SimpleReader-v778-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            apk-sha256.txt
            apk-package-info.txt
            v778-full-unit-tests.log
            gradle-build.log
            v778-emulator-signature.txt
            v778-emulator-install.txt
            v778-emulator-start.txt
            v778-emulator-logcat.txt
            v778-emulator-activity.txt
            v778-emulator-pid.txt
            v778-emulator-result.txt
            signing-tools/apksigner
            signing-tools/lib/apksigner.jar
          if-no-files-found: warn
          retention-days: 7
