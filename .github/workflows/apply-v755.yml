name: Apply 简阅 v755

on:
  push:
    branches:
      - source-v755
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v755:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v755
          fetch-depth: 0
      - name: Apply v755 search-navigation fix without weakening anti-rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rpath = Path('app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt')
          r = rpath.read_text()
          old = '''        currentPageIndex = index.coerceIn(0, pages.lastIndex)\n        lastStableSourceOffset = pages[currentPageIndex].startOffset\n        if (pageTurnMode == TURN_MODE_VERTICAL) {\n'''
          new = '''        currentPageIndex = index.coerceIn(0, pages.lastIndex)\n        val targetPage = pages[currentPageIndex]\n        lastStableSourceOffset = targetPage.startOffset\n        // v755: explicit navigation while a dialog owns focus replaces the pre-dialog restore anchor.\n        if (pageTurnMode == TURN_MODE_VERTICAL && verticalWindowSuspended) {\n            suspendedAnchorOffset = targetPage.startOffset\n            suspendedAnchorViewportPx = 0\n        }\n        if (pageTurnMode == TURN_MODE_VERTICAL) {\n'''
          if new not in r:
              if old not in r:
                  raise SystemExit('jumpToPage anchor patch target not found')
              r = r.replace(old, new, 1)
          if 'onHit = { hit -> jumpToPage(hit.globalPageIndex, false, hit) }' not in r:
              raise SystemExit('search hit navigation contract missing')
          rpath.write_text(r)

          bpath = Path('app/build.gradle.kts')
          b = bpath.read_text().replace('2098000754', '2098000755').replace('?: "754"', '?: "755"')
          bpath.write_text(b)

          base = Path('tools/v754-40-gates.sh').read_text()
          base = base.replace('2098000754', '2098000755').replace('"754"', '"755"')
          base = base.replace("printf 'ALL_40_GATES_PASS\\n'\n", '')
          extra = r'''
          grep -Fq 'onHit = { hit -> jumpToPage(hit.globalPageIndex, false, hit) }' "$R" || fail 41 'search hit navigation missing'
          python3 - <<'P2'
          from pathlib import Path
          r=Path('app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt').read_text()
          s=r.index('    private fun jumpToPage(')
          e=r.index('    private fun jumpChapter(', s)
          b=r[s:e]
          assert 'val targetPage = pages[currentPageIndex]' in b
          assert 'if (pageTurnMode == TURN_MODE_VERTICAL && verticalWindowSuspended)' in b
          assert 'suspendedAnchorOffset = targetPage.startOffset' in b
          assert 'suspendedAnchorViewportPx = 0' in b
          P2
          pass 41 'explicit search/navigation replaces stale dialog restore anchor'

          for token in 'RecyclerView(this)' 'LinearLayoutManager(this, RecyclerView.VERTICAL, false)' 'verticalAdapter?.setPages(paged.pages)' 'suspendedAnchorOffset = pages[index].startOffset' 'scrollToPositionWithOffset(pageIndex, viewportOffset)'; do
            grep -Fq "$token" "$R" || fail 42 "anti-rollback architecture missing: $token"
          done
          pass 42 'RecyclerView virtualized reader and focus anti-rollback preserved'
          printf 'ALL_42_GATES_PASS\n'
          '''.replace('          ', '')
          g = Path('tools/v755-42-gates.sh')
          g.write_text(base + extra)
          g.chmod(0o755)
          PY
      - name: Commit v755 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt app/build.gradle.kts tools/v755-42-gates.sh
          if git diff --cached --quiet; then
            echo "v755 patch already applied"
            exit 0
          fi
          git commit -m "v755: preserve explicit search navigation across focus restore"
          git push origin HEAD:source-v755
