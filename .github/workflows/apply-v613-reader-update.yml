name: Apply v613 reader update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v613-reader-update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v613 branch
        uses: actions/checkout@v4
        with:
          ref: v613-reader-update
          fetch-depth: 0

      - name: Restore and verify exact v613 source
        shell: bash
        run: |
          set -euo pipefail
          echo '2779c4931223c1dfca2335d85c81900f751db4fc2db28b80088de48a7e4d3863  .github/v613-payload.part03x0' | sha256sum -c -
          echo '5a9ae2ea53de6b43d6dbbfc99d32798bbad292f476cf35b396995ca72e862629  .github/v613-payload.part03x1' | sha256sum -c -
          cat \
            .github/v613-payload.part00 \
            .github/v613-payload.part01 \
            .github/v613-payload.part02 \
            .github/v613-payload.part03x0 \
            .github/v613-payload.part03x1 \
            .github/v613-payload.part04 \
            .github/v613-payload.part05 \
            .github/v613-payload.part06 \
            .github/v613-payload.part07 \
            .github/v613-payload.part08 \
            .github/v613-payload.part09 \
            .github/v613-payload.part10 \
            .github/v613-payload.part11 \
            .github/v613-payload.part12 \
            | base64 -d > /tmp/v613-files.tar.gz
          echo '4b58f8ae462e8b5d984d557b9fb41b0e4ed3c25f47c2ebb1e7a9b373c48d258e  /tmp/v613-files.tar.gz' | sha256sum -c -
          gzip -t /tmp/v613-files.tar.gz
          tar -tzf /tmp/v613-files.tar.gz >/tmp/v613-files.list
          test "$(wc -l </tmp/v613-files.list)" -eq 18
          tar -xzf /tmp/v613-files.tar.gz
          cat .github/v613-mode.patch.part* > /tmp/v613-mode.patch
          echo '96f1ebda7f12feb537485863c090534d57563f955c6a5c5936d9c75fab8c0f73  /tmp/v613-mode.patch' | sha256sum -c -
          git apply --check /tmp/v613-mode.patch
          git apply /tmp/v613-mode.patch
          test "$(grep -c 'CATALOG_RULE_VERSION = 2' app/src/main/java/com/simplereader/app/parser/TxtParser.kt)" -eq 1
          grep -q 'arrayOf("全书架目录缓存", "全书架无目录书籍缓存")' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          grep -q 'forceCatalogRefresh = true' app/src/main/java/com/simplereader/app/worker/ShelfCacheWorker.kt
          grep -q 'TITLE_SIZE_DELTA_SP = 2f' app/src/main/java/com/simplereader/app/reader/page/ReaderCacheProfile.kt
          grep -q 'TOP_GUARD_DP = 24' app/src/main/java/com/simplereader/app/reader/page/ReaderCacheProfile.kt
          grep -q '2098000613' app/build.gradle.kts
          bash tools/verify-ui-policy.sh

      - name: Commit verified v613 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/v613-payload.part* .github/v613-mode.patch.part* .github/workflows/apply-v613-reader-update.yml .github/v613-apply-trigger.txt
          git add -A
          git commit -m 'v613: reader titles, catalog rules and shelf catalog cache modes'
          git push origin HEAD:v613-reader-update
