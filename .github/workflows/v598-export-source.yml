name: v598 export stable source

on:
  push:
    branches:
      - agent/v598-reader-only-duokan
  pull_request:
    branches:
      - baseline/v575

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'agent/v598-reader-only-duokan' || github.ref_name == 'agent/v598-reader-only-duokan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v598-reader-only-duokan
      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m zip -qr /tmp/simplereader-v598-stable-source.zip . -x '.git/*' 'app/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: simplereader-v598-stable-source
          path: /tmp/simplereader-v598-stable-source.zip
          if-no-files-found: error
          retention-days: 2
