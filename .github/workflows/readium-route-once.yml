name: Apply Readium route once

on:
  push:
    branches:
      - agent/readium-epub-reader
    paths:
      - .github/workflows/readium-route-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/readium-epub-reader
          fetch-depth: 0

      - name: Route EPUB to Readium activity
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/simplereader/app/ui/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          old = '''    private fun openBook(bookId: Long) {
                  startActivity(Intent(this, ReaderActivity::class.java).putExtra("bookId", bookId))
              }
          '''
          new = '''    private fun openBook(bookId: Long) {
                  val targetActivity = if (
                      books.firstOrNull { it.id == bookId }
                          ?.format
                          .equals("EPUB", ignoreCase = true)
                  ) {
                      ReadiumEpubActivity::class.java
                  } else {
                      ReaderActivity::class.java
                  }
                  startActivity(Intent(this, targetActivity).putExtra("bookId", bookId))
              }
          '''
          if old not in text:
              raise SystemExit("Expected openBook block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove one-shot workflow
        run: rm .github/workflows/readium-route-once.yml

      - name: Commit route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/simplereader/app/ui/MainActivity.kt .github/workflows/readium-route-once.yml
          git commit -m "Route EPUB books to Readium reader"
          git push origin HEAD:agent/readium-epub-reader
