name: Validate and build 简阅 v793 short-burst rollback

on:
  push:
    branches:
      - source-v793
    paths:
      - tools/apply-v793-short-burst-rollback.py
      - .github/workflows/build-v793-short-burst-rollback.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  SIMPLE_READER_VERSION_CODE: "2098000793"
  SIMPLE_READER_VERSION_NAME: "793"

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source-v793
        uses: actions/checkout@v4
        with:
          ref: source-v793
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply deterministic v793 burst patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-v793-short-burst-rollback.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TXT_READER_RENDERING_MAINTENANCE_LOG.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'private const val VERTICAL_ROLLBACK_MIN_PAGE_DELTA = 20' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'private const val VERTICAL_ROLLBACK_BURST_IDLE_MS = 1_000L' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'pageDelta > VERTICAL_ROLLBACK_MIN_PAGE_DELTA' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'showVerticalRollback(rollbackOrigin, "explicit_jump_burst")' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'private const val VERTICAL_SETTLING_GUARD_MS = 5_000L' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'private const val VERTICAL_ROLLBACK_VISIBLE_MS = 3_000L' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt

      - name: Warm or refresh runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew :app:checkDebugAarMetadata --offline --stacktrace --console=plain; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if ./gradlew :app:checkDebugAarMetadata --refresh-dependencies --stacktrace --console=plain; then
              exit 0
            fi
          done
          exit 1

      - name: Run v793 targeted tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests 'com.simplereader.app.ui.ReaderV793ShortBurstRollbackContractTest' \
            --tests 'com.simplereader.app.ui.ReaderV792RollbackThresholdContractTest' \
            --tests 'com.simplereader.app.ui.ReaderV791VerticalRollbackContractTest' \
            --tests 'com.simplereader.app.ui.ReaderCacheAndRestoreContractTest' \
            --tests 'com.simplereader.app.ui.ReaderCatalogAndProgressUiContractTest' \
            --stacktrace --console=plain
          ./gradlew testReleaseUnitTest \
            --tests 'com.simplereader.app.ui.ReaderV793ShortBurstRollbackContractTest' \
            --tests 'com.simplereader.app.ui.ReaderV792RollbackThresholdContractTest' \
            --tests 'com.simplereader.app.ui.ReaderV791VerticalRollbackContractTest' \
            --tests 'com.simplereader.app.ui.ReaderCacheAndRestoreContractTest' \
            --tests 'com.simplereader.app.ui.ReaderCatalogAndProgressUiContractTest' \
            --stacktrace --console=plain

      - name: Check full suite against inherited baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/v759-full-unit-baseline-gate.sh
          bash tools/v759-full-unit-baseline-gate.sh v793-full-unit-tests.log

      - name: Build Debug and Release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --console=plain 2>&1 | tee v793-build.log

      - name: Verify v793 package
        shell: bash
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -s "$unsigned" ] || unsigned="app/build/outputs/apk/release/app-release.apk"
          test -s "$unsigned"
          mkdir -p release
          cp "$unsigned" release/SimpleReader_v793_unsigned.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${build_tools}/aapt2" dump badging "$unsigned" | tee v793-package.txt
          grep -Fq "package: name='com.simplereader.app'" v793-package.txt
          grep -Fq "versionCode='2098000793'" v793-package.txt
          grep -Fq "versionName='793'" v793-package.txt
          sha256sum "$unsigned" | tee v793-unsigned-sha256.txt

      - name: Commit only after validation passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt \
            app/src/test/java/com/simplereader/app/ui/ReaderV791VerticalRollbackContractTest.kt \
            app/src/test/java/com/simplereader/app/ui/ReaderV792RollbackThresholdContractTest.kt \
            app/src/test/java/com/simplereader/app/ui/ReaderV793ShortBurstRollbackContractTest.kt \
            TXT_READER_RENDERING_MAINTENANCE_LOG.md \
            maintenance/V793_SHORT_BURST_ROLLBACK.md
          git diff --cached --exit-code && { echo 'Expected v793 diff is empty'; exit 1; } || true
          git commit -m "v793: accumulate rapid scroll and jump rollback distance"
          git push origin HEAD:source-v793

      - name: Upload validated unsigned v793
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v793-validated-unsigned
          path: |
            release/SimpleReader_v793_unsigned.apk
            v793-package.txt
            v793-unsigned-sha256.txt
            v793-build.log
            v793-full-unit-tests.log
          if-no-files-found: error
          retention-days: 7
