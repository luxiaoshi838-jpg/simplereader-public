name: Sync v631 vertical window behavior

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-v631-scroll-window.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v631 scroll source patch
        run: python3 tools/sync_v631_scroll.py
      - name: Verify patch
        run: |
          grep -Fq 'val threshold = readerScrollView.height * 4' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'continuousTouchActive' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          grep -Fq 'CONTINUOUS_SHIFT_IDLE_MS' app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
      - name: Commit source sync
        run: |
          rm .github/workflows/sync-v631-scroll-window.yml tools/sync_v631_scroll.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix vertical window shift starvation and edge stalls'
          git push origin HEAD:main
