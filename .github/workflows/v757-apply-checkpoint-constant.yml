name: Apply v757 checkpoint constant

on:
  push:
    branches: [source-v757]
    paths:
      - 'tools/v757-add-checkpoint-constant.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v757
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/v757-add-checkpoint-constant.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
          git diff --cached --quiet && exit 1
          git commit -m 'v757 add progress checkpoint delay constant'
          git push origin HEAD:source-v757
