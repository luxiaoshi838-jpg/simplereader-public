name: v593 apply verified source

on:
  push:
    branches:
      - agent/v593-duokan-page-anchor

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and commit verified source
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 5m bash -c '
            cat \
              scripts/v593-source.part00 \
              scripts/v593-source.part01 \
              scripts/v593-source.part02 \
              scripts/v593-source.part03 \
              scripts/v593-source.part04 \
              scripts/v593-source.part05 \
              scripts/v593-source.part06a \
              scripts/v593-source.part06b \
              scripts/v593-source.part06c \
              scripts/v593-source.part06d \
              scripts/v593-source.part07a \
              scripts/v593-source.part07b \
              | base64 -d > /tmp/v593-source.patch

            echo "477bee88799d66e76e53e47fa06a12ed9c1eb33ab32426982508dca8612473f3  /tmp/v593-source.patch" | sha256sum -c -
            git apply --check /tmp/v593-source.patch
            git apply --index /tmp/v593-source.patch
            git diff --cached --check

            staged=$(git diff --cached --name-only)
            printf "%s\n" "$staged"
            test "$(printf "%s\n" "$staged" | sed "/^$/d" | wc -l)" -eq 7
            printf "%s\n" "$staged" | grep -Fxq app/src/main/java/com/simplereader/app/parser/TxtParser.kt
            printf "%s\n" "$staged" | grep -Fxq app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheManager.kt
            printf "%s\n" "$staged" | grep -Fxq app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheWorker.kt
            printf "%s\n" "$staged" | grep -Fxq app/src/main/java/com/simplereader/app/ui/MainActivity.kt
            printf "%s\n" "$staged" | grep -Fxq app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
            printf "%s\n" "$staged" | grep -Fxq app/src/main/java/com/simplereader/app/ui/ReaderPageIndexStore.kt
            printf "%s\n" "$staged" | grep -Fxq app/src/test/java/com/simplereader/app/ui/ReaderOneClickCacheArchitectureTest.kt

            grep -Fq "arrayOf(\"批量管理分组\", \"同步书架\", \"一键缓存\")" app/src/main/java/com/simplereader/app/ui/MainActivity.kt
            grep -Fq "completeChapterCount" app/src/main/java/com/simplereader/app/reader/cache/ReaderPageCacheWorker.kt
            grep -Fq "TXT_INITIAL_WINDOW_BYTES = 32 * 1024" app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
            ! grep -Fq "MENU_CACHE_BOOK" app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt

            git rm scripts/v593-source.part00 scripts/v593-source.part01 scripts/v593-source.part02 scripts/v593-source.part03 scripts/v593-source.part04 scripts/v593-source.part05 scripts/v593-source.part06a scripts/v593-source.part06b scripts/v593-source.part06c scripts/v593-source.part06d scripts/v593-source.part07a scripts/v593-source.part07b .github/workflows/v593-apply-source.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "v593: materialize Duokan anchors and shelf cache source"
            git show --name-only --format= HEAD | grep -Fxq app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt
            git show --name-only --format= HEAD | grep -Fxq app/src/main/java/com/simplereader/app/ui/MainActivity.kt
            git push origin HEAD:agent/v593-duokan-page-anchor
          '
