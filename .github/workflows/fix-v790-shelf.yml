name: Validate and commit 简阅 v790 shelf fix

on:
  push:
    branches:
      - source-v790
    paths:
      - tools/apply-v790-shelf-fix.py
      - .github/workflows/fix-v790-shelf.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  SIMPLE_READER_VERSION_CODE: "2098000790"
  SIMPLE_READER_VERSION_NAME: "790"

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source-v790
        uses: actions/checkout@v4
        with:
          ref: source-v790
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply deterministic v790 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-v790-shelf-fix.py
          git diff --check
          grep -Fq 'recreate()' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          ! grep -Fq 'layoutParams = originalParams' app/src/main/java/com/simplereader/app/ui/MainActivity.kt
          ! grep -Fq 'val originalParams = card.layoutParams' app/src/main/java/com/simplereader/app/ui/MainActivity.kt

      - name: Run v788-v790 targeted tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests 'com.simplereader.app.ui.ShelfV788LayoutSwitchContractTest' \
            --tests 'com.simplereader.app.ui.V789ExternalOpenAndLogContractTest' \
            --tests 'com.simplereader.app.ui.ShelfV790LayoutSafetyContractTest' \
            --stacktrace --console=plain
          ./gradlew testReleaseUnitTest \
            --tests 'com.simplereader.app.ui.ShelfV788LayoutSwitchContractTest' \
            --tests 'com.simplereader.app.ui.V789ExternalOpenAndLogContractTest' \
            --tests 'com.simplereader.app.ui.ShelfV790LayoutSafetyContractTest' \
            --stacktrace --console=plain

      - name: Check full suite against inherited baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/v759-full-unit-baseline-gate.sh
          bash tools/v759-full-unit-baseline-gate.sh v790-full-unit-tests.log

      - name: Build Debug and Release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --console=plain 2>&1 | tee v790-build.log

      - name: Verify v790 package
        shell: bash
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -s "$unsigned" ] || unsigned="app/build/outputs/apk/release/app-release.apk"
          test -s "$unsigned"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${build_tools}/aapt2" dump badging "$unsigned" | tee v790-package.txt
          grep -Fq "package: name='com.simplereader.app'" v790-package.txt
          grep -Fq "versionCode='2098000790'" v790-package.txt
          grep -Fq "versionName='790'" v790-package.txt
          mkdir -p release
          cp "$unsigned" release/SimpleReader_v790_unsigned.apk
          sha256sum "$unsigned" | tee v790-unsigned-sha256.txt

      - name: Commit only after validation passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/simplereader/app/ui/MainActivity.kt \
            app/src/test/java/com/simplereader/app/ui/ShelfV790LayoutSafetyContractTest.kt \
            maintenance/V790_SHELF_LAYOUT_ARCH_FIX.md
          git diff --cached --exit-code && { echo 'Expected repair diff is empty'; exit 1; } || true
          git commit -m "v790: fix shelf list-grid layoutParams crash"
          git push origin HEAD:source-v790

      - name: Upload validated unsigned v790
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v790-validated-unsigned
          path: |
            release/SimpleReader_v790_unsigned.apk
            v790-package.txt
            v790-unsigned-sha256.txt
            v790-build.log
            v790-full-unit-tests.log
          if-no-files-found: error
          retention-days: 7
