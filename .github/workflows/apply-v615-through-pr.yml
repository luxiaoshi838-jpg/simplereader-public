name: Apply v615 through PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v615-reader-stability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v615-reader-stability
          fetch-depth: 0
      - name: Apply verified v615 patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .automation/v615-ready
          cat .automation/v615-patch.part* | base64 -d | gzip -d > /tmp/v615.patch
          git apply --check /tmp/v615.patch
          git apply /tmp/v615.patch
          mkdir -p app/src/main/res/drawable-nodpi
          cat .automation/v615-cover.part* | base64 -d > app/src/main/res/drawable-nodpi/book_cover_default_generic.webp
          rm -f app/src/main/res/drawable-nodpi/book_cover_default_txt.webp
          bash tools/verify-ui-policy.sh
          rm -f .automation/v615-* .github/workflows/apply-v615-reader-fix.yml .github/workflows/apply-v615-through-pr.yml .github/workflows/export-agent-source.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "v615: stabilize large-book reading and restore supplied textures"
          git push origin HEAD:agent/v615-reader-stability
