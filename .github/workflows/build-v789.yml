name: Build 简阅 v789 for local signing

# Final build trigger after validated app corrections were committed.
on:
  push:
    branches:
      - source-v789
    paths:
      - app/**
      - tools/**
      - .github/workflows/build-v789.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v789-local-signing
  cancel-in-progress: true

env:
  SIMPLE_READER_VERSION_CODE: "2098000789"
  SIMPLE_READER_VERSION_NAME: "789"
  MAX_APK_BYTES: "52428800"

jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v789
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce source and UI policy
        shell: bash
        run: |
          set -euo pipefail
          bash tools/verify-no-apk.sh
          bash tools/verify-ui-policy.sh
          grep -Fq '2098000789' app/build.gradle.kts
          grep -Fq 'generatedVersionName = System.getenv("SIMPLE_READER_VERSION_NAME") ?: "789"' app/build.gradle.kts

      - name: Run v787-v789 targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests 'com.simplereader.app.ui.ShelfV787ContractTest' \
            --tests 'com.simplereader.app.ui.ShelfV788LayoutSwitchContractTest' \
            --tests 'com.simplereader.app.ui.V789ExternalOpenAndLogContractTest' \
            --stacktrace --console=plain
          ./gradlew testReleaseUnitTest \
            --tests 'com.simplereader.app.ui.ShelfV787ContractTest' \
            --tests 'com.simplereader.app.ui.ShelfV788LayoutSwitchContractTest' \
            --tests 'com.simplereader.app.ui.V789ExternalOpenAndLogContractTest' \
            --stacktrace --console=plain

      - name: Check full unit suite against inherited known-failure baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/v759-full-unit-baseline-gate.sh
          bash tools/v759-full-unit-baseline-gate.sh v789-full-unit-tests.log

      - name: Build debug and release v789
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Verify unsigned package and bundle local signing tools
        shell: bash
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -s "$unsigned" ] || unsigned="app/build/outputs/apk/release/app-release.apk"
          test -s "$unsigned"
          mkdir -p release signing-tools/lib
          cp "$unsigned" release/SimpleReader_v789_unsigned.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${build_tools}/aapt2" dump badging "$unsigned" | tee apk-package-info.txt
          grep -Fq "package: name='com.simplereader.app'" apk-package-info.txt
          grep -Fq "versionCode='2098000789'" apk-package-info.txt
          grep -Fq "versionName='789'" apk-package-info.txt
          test "$(stat -c %s "$unsigned")" -le "$MAX_APK_BYTES"
          sha256sum "$unsigned" | tee apk-unsigned-sha256.txt
          cp "${build_tools}/apksigner" signing-tools/apksigner
          cp "${build_tools}/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp "${build_tools}/aapt2" signing-tools/aapt2
          chmod +x signing-tools/apksigner signing-tools/aapt2
          signing-tools/apksigner version | tee apksigner-version.txt

      - name: Upload unsigned v789 and public Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: SimpleReader-v789-unsigned-tools-${{ github.run_number }}
          path: |
            release/SimpleReader_v789_unsigned.apk
            signing-tools/apksigner
            signing-tools/lib/apksigner.jar
            signing-tools/aapt2
            apk-package-info.txt
            apk-unsigned-sha256.txt
            apksigner-version.txt
            gradle-build.log
            v789-full-unit-tests.log
          if-no-files-found: error
          retention-days: 7

  android35-shelf-toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v789
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 35 installed-app shelf toggle regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            ./gradlew assembleDebug --stacktrace --console=plain
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.simplereader.app >/dev/null
            adb logcat -c
            adb shell monkey -p com.simplereader.app -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 2

            dump_ui() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            }

            center_for_text() {
              python3 - "$1" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            wanted = sys.argv[1]
            root = ET.parse('/tmp/window.xml').getroot()
            for node in root.iter('node'):
                if node.attrib.get('text') == wanted:
                    m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                    if not m:
                        continue
                    x1, y1, x2, y2 = map(int, m.groups())
                    print((x1 + x2) // 2, (y1 + y2) // 2)
                    raise SystemExit(0)
            raise SystemExit(f'UI text not found: {wanted}')
            PY
            }

            assert_alive() {
              test -n "$(adb shell pidof com.simplereader.app | tr -d '\r')"
              if adb logcat -d AndroidRuntime:E '*:S' | grep -q 'FATAL EXCEPTION'; then
                adb logcat -d AndroidRuntime:E '*:S'
                exit 1
              fi
            }

            current="宫格"
            dump_ui
            grep -Fq 'text="宫格"' /tmp/window.xml
            assert_alive

            for i in $(seq 1 12); do
              coords="$(center_for_text "$current")"
              x="${coords%% *}"
              y="${coords##* }"
              adb shell input tap "$x" "$y"
              sleep 1
              dump_ui
              if [ "$current" = "宫格" ]; then
                current="列表"
              else
                current="宫格"
              fi
              grep -Fq "text=\"$current\"" /tmp/window.xml
              assert_alive
            done

            echo "Android 35 shelf toggle passed: 12 transitions, app process alive, no fatal exception."
