name: Apply 简阅 v760 hot-path fix

on:
  push:
    branches:
      - source-v760

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v760-hotpath-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v760
          fetch-depth: 0
      - name: Apply v760 hot-path isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build_path = Path('app/build.gradle.kts')
          reader_path = Path('app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt')
          adapter_path = Path('app/src/main/java/com/simplereader/app/ui/VerticalPageAdapter.kt')

          build = build_path.read_text(encoding='utf-8')
          build = build.replace('2098000759', '2098000760')
          build = build.replace('?: "759"', '?: "760"')
          build_path.write_text(build, encoding='utf-8')

          reader = reader_path.read_text(encoding='utf-8')

          marker = '    private var lastDisplayedChapterTitle: String? = null\n'
          addition = marker + '    private var pendingVerticalDiagnosticEvent: String? = null\n'
          if 'pendingVerticalDiagnosticEvent' not in reader:
              if marker not in reader:
                  raise SystemExit('ReaderActivity field marker missing')
              reader = reader.replace(marker, addition, 1)

          hot_log = '''        CrashLogStore.recordReaderPosition(
              this, bookId, index, pages.size, pages[index].startOffset,
              pageTurnMode, "vertical_page", force = false
          )
'''
          if hot_log not in reader:
              raise SystemExit('V759 hot-path recordReaderPosition block missing')
          reader = reader.replace(hot_log, '', 1)

          old_suppress = '''        CrashLogStore.recordEvent(
              this,
              "vertical_suppressed_position_reset book=$bookId from=$previousIndex to=$index dy=$dy current=$currentPageIndex stable=$lastStableSourceOffset"
          )
'''
          new_suppress = '''        pendingVerticalDiagnosticEvent =
              "vertical_suppressed_position_reset book=$bookId from=$previousIndex to=$index dy=$dy current=$currentPageIndex stable=$lastStableSourceOffset"
'''
          if old_suppress not in reader:
              raise SystemExit('V759 suppression diagnostic block missing')
          reader = reader.replace(old_suppress, new_suppress, 1)

          insert_before = '''    internal fun verticalOnUserDrag(): Int? {
'''
          new_methods = '''    private fun persistVerticalDiagnosticState(event: String, force: Boolean = false) {
              val pages = readerBook?.pages.orEmpty()
              val page = pages.getOrNull(currentPageIndex) ?: return
              CrashLogStore.recordReaderPosition(
                  this, bookId, page.globalPageIndex, pages.size, page.startOffset,
                  pageTurnMode, event, force = force
              )
              pendingVerticalDiagnosticEvent?.let { diagnostic ->
                  pendingVerticalDiagnosticEvent = null
                  CrashLogStore.recordEvent(this, diagnostic)
              }
          }

          internal fun verticalOnScrollIdle() {
              if (pageTurnMode != TURN_MODE_VERTICAL || verticalShouldIgnoreScroll()) return
              persistVerticalDiagnosticState("vertical_idle", force = false)
          }

'''
          if 'internal fun verticalOnScrollIdle()' not in reader:
              if insert_before not in reader:
                  raise SystemExit('verticalOnUserDrag insertion marker missing')
              reader = reader.replace(insert_before, new_methods + insert_before, 1)

          old_pause = '''    override fun onPause() {
              stopAutoReading(false)
              CrashLogStore.recordEvent(this, "ReaderActivity.onPause book=$bookId page=$currentPageIndex stable=$lastStableSourceOffset")
              saveProgress()
              super.onPause()
          }
'''
          new_pause = '''    override fun onPause() {
              stopAutoReading(false)
              if (pageTurnMode == TURN_MODE_VERTICAL) {
                  persistVerticalDiagnosticState("vertical_pause", force = true)
              }
              CrashLogStore.recordEvent(this, "ReaderActivity.onPause book=$bookId page=$currentPageIndex stable=$lastStableSourceOffset")
              saveProgress()
              super.onPause()
          }
'''
          if old_pause not in reader:
              raise SystemExit('onPause block missing')
          reader = reader.replace(old_pause, new_pause, 1)
          reader_path.write_text(reader, encoding='utf-8')

          adapter = adapter_path.read_text(encoding='utf-8')
          old_state = '''    override fun onScrollStateChanged(recyclerView: RecyclerView, newState: Int) {
              if (newState == RecyclerView.SCROLL_STATE_DRAGGING) {
                  val hitPage = activity.verticalOnUserDrag()
                  if (hitPage != null) {
                      (recyclerView.adapter as? VerticalPageAdapter)
                          ?.clearTransientSearchHighlight(recyclerView, hitPage)
                  }
              }
          }
'''
          new_state = '''    override fun onScrollStateChanged(recyclerView: RecyclerView, newState: Int) {
              if (newState == RecyclerView.SCROLL_STATE_DRAGGING) {
                  val hitPage = activity.verticalOnUserDrag()
                  if (hitPage != null) {
                      (recyclerView.adapter as? VerticalPageAdapter)
                          ?.clearTransientSearchHighlight(recyclerView, hitPage)
                  }
              } else if (newState == RecyclerView.SCROLL_STATE_IDLE) {
                  activity.verticalOnScrollIdle()
              }
          }
'''
          if old_state not in adapter:
              raise SystemExit('VerticalScrollListener state block missing')
          adapter = adapter.replace(old_state, new_state, 1)
          adapter_path.write_text(adapter, encoding='utf-8')

          Path('tools/v760-52-gates.sh').write_text(r'''#!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")/.." && pwd)"
          cd "$ROOT"
          TMP="$(mktemp tools/v760-52-generated.XXXXXX.sh)"
          trap 'rm -f "$TMP"' EXIT
          python3 - "$TMP" <<'PY2'
          from pathlib import Path
          import sys
          source = Path('tools/v759-52-gates.sh').read_text(encoding='utf-8')
          source = source.replace('2098000759', '2098000760')
          source = source.replace("'\\\"759\\\"'", "'\\\"760\\\"'")
          source = source.replace('v759', 'v760')
          Path(sys.argv[1]).write_text(source, encoding='utf-8')
          PY2
          bash "$TMP"
          ''', encoding='utf-8')

          Path('tools/v760-crash-diagnostics-gates.sh').write_text(r'''#!/usr/bin/env bash
          set -euo pipefail
          TMP="$(mktemp tools/v760-crash-generated.XXXXXX.sh)"
          trap 'rm -f "$TMP"' EXIT
          python3 - "$TMP" <<'PY2'
          from pathlib import Path
          import sys
          source = Path('tools/v759-crash-diagnostics-gates.sh').read_text(encoding='utf-8')
          source = source.replace('2098000759', '2098000760')
          source = source.replace('?: "759"', '?: "760"')
          source = source.replace('v759', 'v760')
          Path(sys.argv[1]).write_text(source, encoding='utf-8')
          PY2
          bash "$TMP"
          ''', encoding='utf-8')

          Path('tools/v760-scroll-hotpath-gates.sh').write_text(r'''#!/usr/bin/env bash
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re

          reader = Path('app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt').read_text(encoding='utf-8')
          adapter = Path('app/src/main/java/com/simplereader/app/ui/VerticalPageAdapter.kt').read_text(encoding='utf-8')
          build = Path('app/build.gradle.kts').read_text(encoding='utf-8')

          assert '2098000760' in build and '?: "760"' in build

          listener = re.search(r'class VerticalScrollListener\(.*?\n\}', adapter, re.S)
          assert listener, 'VerticalScrollListener missing'
          listener_body = listener.group(0)
          on_scrolled = re.search(r'override fun onScrolled\(.*?\n    \}', listener_body, re.S)
          assert on_scrolled, 'onScrolled missing'
          hot = on_scrolled.group(0)
          for forbidden in ('CrashLogStore', 'recordReaderPosition', 'recordEvent', 'saveProgress('):
              assert forbidden not in hot, f'hot-path forbidden call: {forbidden}'
          assert 'verticalShouldSuppressReportedIndex' in hot
          assert 'verticalOnPageVisible(index)' in hot

          visible = re.search(r'internal fun verticalOnPageVisible\(index: Int\) \{(.*?)\n    \}', reader, re.S)
          assert visible, 'verticalOnPageVisible missing'
          visible_body = visible.group(1)
          for forbidden in ('CrashLogStore', 'recordReaderPosition', 'recordEvent'):
              assert forbidden not in visible_body, f'visible hot-path forbidden call: {forbidden}'
          assert 'currentPageIndex == index' in visible_body
          assert 'updateProgressUi()' in visible_body
          assert 'scheduleProgressCheckpoint' in visible_body

          suppress = re.search(r'internal fun verticalShouldSuppressReportedIndex\(.*?\n    \}', reader, re.S)
          assert suppress
          assert 'CrashLogStore' not in suppress.group(0)
          assert 'pendingVerticalDiagnosticEvent' in suppress.group(0)

          idle = re.search(r'internal fun verticalOnScrollIdle\(\) \{(.*?)\n    \}', reader, re.S)
          assert idle, 'verticalOnScrollIdle missing'
          assert 'persistVerticalDiagnosticState("vertical_idle", force = false)' in idle.group(1)
          state_change = re.search(r'override fun onScrollStateChanged\(.*?\n    \}', listener_body, re.S)
          assert state_change
          assert 'RecyclerView.SCROLL_STATE_IDLE' in state_change.group(0)
          assert 'activity.verticalOnScrollIdle()' in state_change.group(0)

          persist = re.search(r'private fun persistVerticalDiagnosticState\(.*?\n    \}', reader, re.S)
          assert persist
          assert 'CrashLogStore.recordReaderPosition' in persist.group(0)
          assert 'CrashLogStore.recordEvent' in persist.group(0)

          assert 'breakStrategy = Layout.BREAK_STRATEGY_SIMPLE' in adapter
          assert 'hyphenationFrequency = Layout.HYPHENATION_FREQUENCY_NONE' in adapter
          assert 'LruCache<Int, CharSequence>(32)' in adapter
          assert 'setItemViewCacheSize(12)' in reader
          assert 'initialPrefetchItemCount = 8' in reader

          print('v760 scroll hot-path isolation gates: PASS')
          PY2
          ''', encoding='utf-8')

          Path('tools/v760-full-unit-baseline-gate.sh').write_text(
              Path('tools/v759-full-unit-baseline-gate.sh').read_text(encoding='utf-8')
                  .replace('v759-full-unit-tests.log', 'v760-full-unit-tests.log')
                  .replace('V759', 'V760')
                  .replace('v759', 'v760'),
              encoding='utf-8'
          )
          PY
          chmod +x tools/v760-52-gates.sh tools/v760-crash-diagnostics-gates.sh tools/v760-scroll-hotpath-gates.sh tools/v760-full-unit-baseline-gate.sh
      - name: Verify static gates before commit
        shell: bash
        run: |
          bash tools/v760-52-gates.sh
          bash tools/v760-crash-diagnostics-gates.sh
          bash tools/v760-scroll-hotpath-gates.sh
          git diff --check
      - name: Commit v760 source fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts app/src/main/java/com/simplereader/app/ui/ReaderActivity.kt app/src/main/java/com/simplereader/app/ui/VerticalPageAdapter.kt tools/v760-52-gates.sh tools/v760-crash-diagnostics-gates.sh tools/v760-scroll-hotpath-gates.sh tools/v760-full-unit-baseline-gate.sh
          git commit -m 'v760：隔离滚动热路径与异常诊断 [v760-hotpath-applied]'
          git push origin HEAD:source-v760
