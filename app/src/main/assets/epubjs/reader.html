<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>SimpleReader EPUB</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #F5E9C8;
        }
        #viewer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            touch-action: pan-y;
        }
    </style>
    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
</head>
<body>
<div id="viewer"></div>
<script>
(function () {
    "use strict";

    let book = null;
    let rendition = null;
    let currentIndex = 0;
    let currentCfi = "";
    let currentHref = "";
    let currentTitle = "";
    let currentFraction = 0;
    let locationsReady = false;
    let locked = false;
    let fontPercent = 100;
    let nightMode = false;
    let flatToc = [];
    let lastRelocated = null;
    let reportTimer = null;
    let navigationInProgress = false;

    function bridge(name) {
        try {
            const target = window.AndroidBridge;
            if (!target || typeof target[name] !== "function") return;
            const args = Array.prototype.slice.call(arguments, 1);
            target[name].apply(target, args);
        } catch (_) {
            // Native side may already be closing.
        }
    }

    function normalizeHref(href) {
        return String(href || "").split("#")[0].replace(/^\.\//, "");
    }

    function cleanTitle(value) {
        return String(value || "").replace(/\s+/g, " ").trim();
    }

    function flatten(items, depth, output) {
        (items || []).forEach(function (item) {
            output.push({
                title: cleanTitle(item.label || item.title) || "未命名章节",
                href: item.href || "",
                depth: depth
            });
            flatten(item.subitems || item.children || [], depth + 1, output);
        });
        return output;
    }

    function titleForHref(href) {
        const normalized = normalizeHref(href);
        let exact = flatToc.find(function (item) {
            return normalizeHref(item.href) === normalized;
        });
        if (exact) return exact.title;
        exact = flatToc.find(function (item) {
            const candidate = normalizeHref(item.href);
            return candidate && (normalized.endsWith(candidate) || candidate.endsWith(normalized));
        });
        return exact ? exact.title : "";
    }

    function injectContentRules(contents) {
        const doc = contents.document;
        if (!doc || !doc.head) return;
        let style = doc.getElementById("simplereader-continuous-style");
        if (!style) {
            style = doc.createElement("style");
            style.id = "simplereader-continuous-style";
            doc.head.appendChild(style);
        }
        const background = nightMode ? "#151515" : "#F5E9C8";
        const foreground = nightMode ? "#D8D4CC" : "#3B3428";
        style.textContent = [
            "html,body{background:" + background + " !important;color:" + foreground + " !important;overflow-x:hidden !important;touch-action:pan-y !important;}",
            "body{font-size:" + fontPercent + "% !important;line-height:1.75 !important;}",
            "h1,h2,h3,[epub\\:type~='title'],[epub\\:type~='chapter']>:first-child{font-size:1.12em !important;font-weight:700 !important;line-height:1.45 !important;margin-top:.35em !important;margin-bottom:.8em !important;}",
            "img,svg,video,figure{max-width:100% !important;height:auto !important;}",
            "table{max-width:100% !important;}",
            "a{-webkit-tap-highlight-color:transparent;}"
        ].join("");
    }

    function installSafeInput(contents) {
        const doc = contents.document;
        if (!doc || doc.__simpleReaderSafeInputInstalled) return;
        doc.__simpleReaderSafeInputInstalled = true;
        doc.addEventListener("click", function (event) {
            let node = event.target;
            while (node && node.nodeType === 1 && node.tagName !== "A") node = node.parentElement;
            if (node && node.tagName === "A") {
                event.preventDefault();
                event.stopPropagation();
                return false;
            }

            const viewportWidth = contents.window.innerWidth || doc.documentElement.clientWidth || 1;
            const viewportHeight = contents.window.innerHeight || doc.documentElement.clientHeight || 1;
            const x = event.clientX;
            const y = event.clientY;
            const inCenter = x >= viewportWidth * 0.25 && x <= viewportWidth * 0.75 &&
                y >= viewportHeight * 0.25 && y <= viewportHeight * 0.75;
            if (inCenter) {
                event.preventDefault();
                event.stopPropagation();
                reportVisibleCenter(lastRelocated);
                bridge("onCenterTap");
                return false;
            }
            return true;
        }, true);
    }

    function updateAllContents() {
        if (!rendition) return;
        rendition.getContents().forEach(function (contents) {
            injectContentRules(contents);
            installSafeInput(contents);
        });
    }

    function rangeAtPoint(doc, x, y) {
        try {
            if (doc.caretRangeFromPoint) return doc.caretRangeFromPoint(x, y);
            if (doc.caretPositionFromPoint) {
                const position = doc.caretPositionFromPoint(x, y);
                if (!position) return null;
                const range = doc.createRange();
                range.setStart(position.offsetNode, position.offset);
                range.collapse(true);
                return range;
            }
        } catch (_) {
            return null;
        }
        return null;
    }

    function visibleCenterSnapshot() {
        if (!rendition || !book) return null;
        const viewportX = window.innerWidth / 2;
        const viewportY = window.innerHeight / 2;
        let best = null;
        let bestDistance = Number.POSITIVE_INFINITY;

        rendition.getContents().forEach(function (contents) {
            const frame = contents.window && contents.window.frameElement;
            if (!frame) return;
            const rect = frame.getBoundingClientRect();
            if (rect.bottom <= 0 || rect.top >= window.innerHeight || rect.width <= 0 || rect.height <= 0) return;
            const centerDistance = Math.abs(((rect.top + rect.bottom) / 2) - viewportY);
            if (centerDistance < bestDistance) {
                bestDistance = centerDistance;
                best = { contents: contents, rect: rect };
            }
        });

        if (!best) return null;
        const contents = best.contents;
        const rect = best.rect;
        const doc = contents.document;
        if (!doc) return null;
        const localX = Math.max(1, Math.min(rect.width - 1, viewportX - rect.left));
        const localY = Math.max(1, Math.min(rect.height - 1, viewportY - rect.top));
        let cfi = "";

        try {
            const range = rangeAtPoint(doc, localX, localY);
            if (range) cfi = contents.cfiFromRange(range);
            if (!cfi) {
                const node = doc.elementFromPoint(localX, localY);
                if (node) cfi = contents.cfiFromNode(node);
            }
        } catch (_) {
            cfi = "";
        }

        const index = Number.isFinite(contents.sectionIndex) ? contents.sectionIndex : currentIndex;
        const section = book.spine.get(index);
        return {
            index: index,
            cfi: cfi,
            href: section && section.href ? section.href : currentHref
        };
    }

    function reportVisibleCenter(fallbackLocation) {
        const snapshot = visibleCenterSnapshot();
        const fallback = fallbackLocation && fallbackLocation.start ? fallbackLocation.start : null;
        const nextCfi = snapshot && snapshot.cfi ? snapshot.cfi : (fallback && fallback.cfi ? fallback.cfi : currentCfi);
        const nextHref = snapshot && snapshot.href ? snapshot.href : (fallback && fallback.href ? fallback.href : currentHref);
        const nextIndex = snapshot && Number.isFinite(snapshot.index)
            ? snapshot.index
            : (fallback && Number.isFinite(fallback.index) ? fallback.index : currentIndex);

        if (!nextCfi) return;
        currentCfi = nextCfi;
        currentHref = nextHref;
        currentIndex = nextIndex;
        currentTitle = titleForHref(currentHref) || currentTitle;

        if (locationsReady) {
            const located = book.locations.percentageFromCfi(currentCfi);
            if (Number.isFinite(located)) currentFraction = Math.max(0, Math.min(1, located));
        } else if (fallback && Number.isFinite(fallback.percentage)) {
            currentFraction = Math.max(0, Math.min(1, fallback.percentage));
        }

        bridge("onLocationChanged", currentCfi, currentHref, currentTitle, currentFraction);
    }

    function scheduleVisibleReport(location, delay) {
        if (location) lastRelocated = location;
        if (navigationInProgress) return;
        clearTimeout(reportTimer);
        reportTimer = setTimeout(function () {
            reportVisibleCenter(lastRelocated);
        }, Number(delay) || 160);
    }

    function nextFrame() {
        return new Promise(function (resolve) {
            requestAnimationFrame(function () { resolve(); });
        });
    }

    function wait(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    async function navigateTo(target, failureMessage) {
        if (!rendition || !book || !locked || navigationInProgress || !target) return false;
        navigationInProgress = true;
        clearTimeout(reportTimer);
        try {
            await rendition.display(target);
            await nextFrame();
            await nextFrame();
            await wait(140);
            navigationInProgress = false;
            reportVisibleCenter(lastRelocated);
            bridge("onNavigationSettled", true, "");
        } catch (error) {
            navigationInProgress = false;
            bridge("onNavigationSettled", false, failureMessage || String(error && error.message || error));
        }
        return true;
    }

    async function openBook(bookUrl, initialCfi, initialFraction, requestedFontPercent, requestedNightMode) {
        try {
            fontPercent = Math.max(75, Math.min(180, Number(requestedFontPercent) || 100));
            nightMode = Boolean(requestedNightMode);
            book = ePub(bookUrl, { openAs: "epub" });
            rendition = book.renderTo("viewer", {
                manager: "continuous",
                flow: "scrolled-doc",
                width: "100%",
                height: "100%",
                spread: "none",
                snap: false,
                allowScriptedContent: false
            });

            rendition.hooks.content.register(function (contents) {
                injectContentRules(contents);
                installSafeInput(contents);
            });
            rendition.on("relocated", function (location) {
                lastRelocated = location;
                scheduleVisibleReport(location, 180);
            });
            rendition.on("rendered", function () {
                updateAllContents();
                scheduleVisibleReport(lastRelocated, 100);
            });

            const navigation = await book.loaded.navigation;
            flatToc = flatten(navigation.toc || [], 0, []);
            bridge("onTocReady", JSON.stringify(flatToc));

            const metadata = await book.loaded.metadata;
            bridge("onBookReady", cleanTitle(metadata.title));

            await rendition.display(initialCfi || undefined);
            await nextFrame();
            await nextFrame();
            updateAllContents();
            reportVisibleCenter(lastRelocated);
            bridge("onEngineReady");

            book.locations.generate(1400).then(async function () {
                locationsReady = true;
                if (!initialCfi && Number(initialFraction) > 0) {
                    const cfi = book.locations.cfiFromPercentage(Math.max(0, Math.min(1, Number(initialFraction))));
                    if (cfi) {
                        navigationInProgress = true;
                        await rendition.display(cfi);
                        await nextFrame();
                        await nextFrame();
                        await wait(140);
                        navigationInProgress = false;
                    }
                }
                reportVisibleCenter(lastRelocated);
            }).catch(function () {
                locationsReady = false;
            });
        } catch (error) {
            bridge("onReaderError", String(error && (error.stack || error.message) || error));
        }
    }

    function goChapter(delta) {
        if (!rendition || !book || !locked || navigationInProgress) return false;
        const targetIndex = currentIndex + Number(delta || 0);
        const target = book.spine.get(targetIndex);
        if (!target || !target.href) {
            bridge("onNavigationSettled", false, Number(delta) < 0 ? "已经是第一章" : "已经是最后一章");
            return false;
        }
        navigateTo(target.href, "无法跳转章节");
        return true;
    }

    function goToHref(href) {
        if (!rendition || !locked || navigationInProgress || !href) return false;
        navigateTo(href, "无法跳转目录");
        return true;
    }

    function goToProgress(fraction) {
        if (!rendition || !book || !locked || navigationInProgress || !locationsReady) return false;
        const normalized = Math.max(0, Math.min(1, Number(fraction) || 0));
        const cfi = book.locations.cfiFromPercentage(normalized);
        if (!cfi) return false;
        navigateTo(cfi, "无法跳转进度");
        return true;
    }

    function setLocked(value) {
        locked = Boolean(value);
    }

    function setFontScale(percent) {
        fontPercent = Math.max(75, Math.min(180, Number(percent) || 100));
        updateAllContents();
        scheduleVisibleReport(lastRelocated, 220);
    }

    function setNight(value) {
        nightMode = Boolean(value);
        document.body.style.background = nightMode ? "#151515" : "#F5E9C8";
        updateAllContents();
    }

    window.SimpleReader = {
        openBook: openBook,
        goChapter: goChapter,
        goToHref: goToHref,
        goToProgress: goToProgress,
        reportNow: function () { reportVisibleCenter(lastRelocated); return true; },
        setLocked: setLocked,
        setFontScale: setFontScale,
        setNight: setNight
    };
    bridge("onShellReady");
})();
</script>
</body>
</html>
